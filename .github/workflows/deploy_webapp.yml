name: Deploy Unified Game Launcher (Janggi, Chess, Block Blast & Pocha Tycoon)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle Unified Game Launcher (Single Root Copy + Subpath Redirect Stubs)
        run: |
          rm -rf build/web
          mkdir -p build/web build/web/arcade build/web/janggi build/web/chess build/web/blockblast build/web/pocha

          # 1. 루트(/) 단일 에셋 및 정본 HTML 배치 (6중 에셋 복사 제거)
          cp -f index.html arcade.html janggi.html chess.html blockblast.html pocha.html manifest.json sw.js build/web/
          cp -r src assets build/web/

          # 2. 하위 호환 서브경로용 경량 리다이렉트 스텁 생성 함수
          write_stub() {
            local dir="$1"
            local target="$2"
            cat > "build/web/${dir}/index.html" <<EOF
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <meta http-equiv="refresh" content="0; url=${target}" />
            <title>이동 중...</title>
            <script>
              window.location.replace('${target}' + window.location.search + window.location.hash);
            </script>
          </head>
          <body style="background:#090c15;color:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
            <a href="${target}" style="color:#fde047;">페이지로 이동</a>
          </body>
          </html>
          EOF
          }

          write_stub "arcade" "../"
          write_stub "janggi" "../janggi.html"
          write_stub "chess" "../chess.html"
          write_stub "blockblast" "../blockblast.html"
          write_stub "pocha" "../pocha.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload WebApp Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-webapp:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-webapp
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
