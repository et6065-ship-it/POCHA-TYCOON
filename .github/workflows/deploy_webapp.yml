name: Deploy Medieval Battle Janggi & Chess WebApp (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle Medieval Battle Janggi & Chess WebApp (Pocha Tycoon Hidden)
        run: |
          rm -rf build/web
          mkdir -p build/web build/web/janggi build/web/chess build/web/arcade

          if [ -d "web_games/board" ]; then
            # 1. 메인 루트(/): 중세 배틀 장기 & 체스 통합 에디션 (상단 탭으로 장기 <-> 체스 즉시 전환)
            cp -r web_games/board/* build/web/

            # 2. /janggi/ 서브경로: 중세 배틀 장기
            cp -r web_games/board/* build/web/janggi/

            # 3. /chess/ 서브경로: 중세 배틀 체스 기본 시작
            cp -r web_games/board/* build/web/chess/
            if [ -f "build/web/chess/chess.html" ]; then
              cp build/web/chess/chess.html build/web/chess/index.html
            fi

            # 4. /arcade/ 서브경로: 장기 & 체스 2종 선택 타이틀 화면 (타이쿤 숨김)
            cp -r web_games/board/* build/web/arcade/
            if [ -f "build/web/arcade/arcade.html" ]; then
              cp build/web/arcade/arcade.html build/web/arcade/index.html
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload WebApp Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-webapp:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-webapp
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
