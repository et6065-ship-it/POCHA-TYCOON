name: Build & Deploy Pocha Tycoon WebApp (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag & Pygame-ce
        run: |
          python -m pip install --upgrade pip
          pip install pygbag pygame-ce

      - name: Prepare clean WebApp bundle directory
        run: |
          rm -f requirements.txt *.bat *.spec *.exe

      - name: Build WebAssembly WebApp with Pygbag
        run: |
          pygbag --ume_block 0 --build --app_name "pocha_tycoon" --title "World Street Food Pocha Tycoon" .

      - name: Remove Pygbag Green Box and Use Pure In-Game Loading & Waiting Screen
        run: |
          python - << 'EOF'
          import pathlib

          index_path = pathlib.Path("build/web/index.html")
          if index_path.exists():
              html = index_path.read_text(encoding="utf-8")
              clean_snippet = """
          <style>
            html, body {
              background: #0c0a16 !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow: hidden !important;
              touch-action: none;
              user-select: none;
              -webkit-user-select: none;
            }
            /* Pygbag 기본 초록색 'Ready to start ! Please click/touch page' 박스 및 콘솔 완전 숨김 */
            #box, #dlg, #pyconsole, #system, #transfer, #status, # progress {
              display: none !important;
              opacity: 0 !important;
              visibility: hidden !important;
              pointer-events: none !important;
              width: 0 !important;
              height: 0 !important;
            }
          </style>
          <script>
          (function(){
            function suppressPygbagGreenBox() {
              if (window.MM) {
                window.MM.ume = true;
              }
              var ids = ["box", "dlg", "pyconsole", "system", "transfer", "status"];
              for (var i = 0; i < ids.length; i++) {
                var el = document.getElementById(ids[i]);
                if (el) {
                  el.style.display = "none";
                  el.style.visibility = "hidden";
                  el.style.pointerEvents = "none";
                }
              }
            }
            suppressPygbagGreenBox();
            var iv = setInterval(suppressPygbagGreenBox, 100);
            setTimeout(function(){ clearInterval(iv); }, 15000);
          })();
          </script>
          """
              if "</body>" in html:
                  html = html.replace("</body>", clean_snippet + "\n</body>")
              else:
                  html += clean_snippet
              index_path.write_text(html, encoding="utf-8")
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload WebApp Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-webapp:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-webapp
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
