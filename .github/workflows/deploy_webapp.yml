name: Deploy Unified Game Launcher (Janggi & Chess WebApp)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle Unified Game Launcher & Medieval Battle Janggi / Chess
        run: |
          rm -rf build/web
          mkdir -p build/web build/web/janggi build/web/chess build/web/arcade

          # 1. 메인 루트(/): 장기·체스·통합런처 에셋 복사
          cp -f index.html janggi.html chess.html arcade.html build/web/
          cp -r src assets build/web/

          # 2. /janggi/ 서브경로: 중세 배틀 장기
          cp -f index.html janggi.html chess.html arcade.html build/web/janggi/
          cp -r src assets build/web/janggi/

          # 3. /chess/ 서브경로: 중세 배틀 체스
          cp -f index.html janggi.html chess.html arcade.html build/web/chess/
          cp -r src assets build/web/chess/
          cp -f chess.html build/web/chess/index.html

          # 4. /arcade/ 서브경로: 통합 게임 런처 (janggi.html & chess.html 정상 연결 보장)
          cp -f index.html janggi.html chess.html arcade.html build/web/arcade/
          cp -r src assets build/web/arcade/
          cp -f arcade.html build/web/arcade/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload WebApp Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-webapp:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-webapp
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
