name: Build & Deploy Pocha Tycoon WebApp (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag & Pygame-ce
        run: |
          python -m pip install --upgrade pip
          pip install pygbag pygame-ce

      - name: Prepare clean WebApp bundle directory
        run: |
          rm -f requirements.txt *.bat *.sh *.desktop *.spec *.exe *.x86_64 build_executables.py 포차타이쿤
          rm -rf assets/sounds

      - name: Build WebAssembly WebApp with Pygbag
        run: |
          pygbag --ume_block 0 --build --app_name "pocha_tycoon" --title "World Street Food Pocha Tycoon" .

      - name: Remove Pygbag Green Box and Cover Boot Phase with Visual Pocha Loading Screen
        run: |
          python - << 'EOF'
          import pathlib

          index_path = pathlib.Path("build/web/index.html")
          if index_path.exists():
              html = index_path.read_text(encoding="utf-8")
              clean_snippet = """
          <style>
            html, body {
              background: #0c0a16 !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow: hidden !important;
              touch-action: none;
              user-select: none;
              -webkit-user-select: none;
            }
            /* Pygbag 기본 초록색 'Ready to start !' / 'Loading, please wait ...' 박스 및 콘솔 완전 숨김 */
            #box, #dlg, #pyconsole, #system, #transfer, #status, #progress {
              display: none !important;
              opacity: 0 !important;
              visibility: hidden !important;
              pointer-events: none !important;
              width: 0 !important;
              height: 0 !important;
            }
            /* 파이썬 첫 프레임이 그려지기 전까지 Pygbag 기본 캔버스의 초록색 Loading 박스를 가림 */
            #canvas:not(.pocha-canvas-ready) {
              opacity: 0 !important;
            }
            #canvas.pocha-canvas-ready {
              opacity: 1 !important;
              transition: opacity 0.22s ease;
            }
            /* 전체화면 포차 부트 로딩 오버레이 */
            #pocha-boot-loader {
              position: fixed;
              inset: 0;
              z-index: 999999;
              background: radial-gradient(circle at 50% 38%, #261c42 0%, #0c0a16 82%);
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
              color: #fff;
              transition: opacity 0.35s ease;
            }
            .pocha-boot-card {
              width: min(88vw, 520px);
              background: rgba(24, 18, 42, 0.94);
              border: 3px solid #ffb43c;
              border-radius: 24px;
              padding: 28px 22px 24px;
              box-shadow: 0 18px 50px rgba(0, 0, 0, 0.72), 0 0 28px rgba(255, 180, 60, 0.25);
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 16px;
            }
            .pocha-boot-lanterns {
              display: flex;
              gap: 14px;
              align-items: center;
              justify-content: center;
            }
            .pocha-lantern-dot {
              width: 14px;
              height: 18px;
              border-radius: 50%;
              background: #ff5238;
              box-shadow: 0 0 12px #ff7838;
              animation: pochaGlow 0.9s infinite alternate ease-in-out;
            }
            .pocha-lantern-dot:nth-child(2n) {
              background: #ffd44c;
              box-shadow: 0 0 12px #ffd44c;
              animation-delay: 0.3s;
            }
            .pocha-boot-stage {
              width: 100%;
              min-height: 120px;
              background: linear-gradient(180deg, rgba(44, 34, 72, 0.9) 0%, rgba(22, 16, 36, 0.95) 100%);
              border: 2px solid rgba(255, 198, 88, 0.45);
              border-radius: 18px;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 18px;
              padding: 16px 10px;
            }
            .pocha-boot-icon {
              font-size: clamp(44px, 10vw, 64px);
              filter: drop-shadow(0 6px 10px rgba(0,0,0,0.55));
              animation: pochaBounce 0.75s infinite alternate ease-in-out;
            }
            .pocha-boot-icon:nth-child(2) { animation-delay: 0.18s; }
            .pocha-boot-icon:nth-child(3) { animation-delay: 0.36s; }
            .pocha-boot-steps {
              display: flex;
              gap: 8px;
              flex-wrap: wrap;
              justify-content: center;
            }
            .pocha-step-chip {
              width: 36px;
              height: 36px;
              border-radius: 10px;
              background: rgba(40, 34, 64, 0.85);
              border: 1.5px solid rgba(140, 130, 175, 0.4);
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 20px;
              transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            }
            .pocha-step-chip.active {
              background: rgba(255, 168, 52, 0.28);
              border-color: #ffd44c;
              transform: scale(1.14);
              box-shadow: 0 0 12px rgba(255, 200, 70, 0.45);
            }
            .pocha-boot-msg {
              font-size: 18px;
              font-weight: 800;
              color: #ffe88a;
              text-align: center;
              letter-spacing: -0.3px;
            }
            .pocha-bar-wrap {
              width: 100%;
              height: 24px;
              background: #141024;
              border: 2px solid #ffb43c;
              border-radius: 999px;
              overflow: hidden;
              position: relative;
            }
            .pocha-bar-fill {
              width: 14%;
              height: 100%;
              background: linear-gradient(90deg, #ff6b2b 0%, #ffc83c 60%, #fff08e 100%);
              border-radius: 999px;
              transition: width 0.3s ease;
            }
            /* 모바일 접속 시 글자를 없애고 그림/게이지 위주로만 표시 */
            @media (max-width: 960px), (pointer: coarse), (orientation: portrait) {
              .pocha-boot-msg {
                display: none !important;
              }
              .pocha-boot-icon {
                font-size: clamp(54px, 13vw, 72px);
              }
            }
            @keyframes pochaBounce {
              from { transform: translateY(4px) scale(0.96); }
              to   { transform: translateY(-7px) scale(1.06); }
            }
            @keyframes pochaGlow {
              from { opacity: 0.65; transform: scale(0.92); }
              to   { opacity: 1.0; transform: scale(1.08); }
            }
          </style>
          <div id="pocha-boot-loader">
            <div class="pocha-boot-card">
              <div class="pocha-boot-lanterns">
                <span class="pocha-lantern-dot"></span>
                <span class="pocha-lantern-dot"></span>
                <span class="pocha-lantern-dot"></span>
                <span class="pocha-lantern-dot"></span>
                <span class="pocha-lantern-dot"></span>
              </div>
              <div class="pocha-boot-stage" id="pocha-boot-art">
                <span class="pocha-boot-icon">🐟</span>
                <span class="pocha-boot-icon">🔥</span>
                <span class="pocha-boot-icon">🍢</span>
              </div>
              <div class="pocha-boot-steps" id="pocha-boot-steps">
                <div class="pocha-step-chip active">🐟</div>
                <div class="pocha-step-chip">🍢</div>
                <div class="pocha-step-chip">🍗</div>
                <div class="pocha-step-chip">🌶️</div>
                <div class="pocha-step-chip">🐙</div>
                <div class="pocha-step-chip">🌮</div>
                <div class="pocha-step-chip">🧋</div>
                <div class="pocha-step-chip">🥘</div>
              </div>
              <div class="pocha-boot-msg" id="pocha-boot-msg">황금빛 붕어빵 틀 예열 중...</div>
              <div class="pocha-bar-wrap">
                <div class="pocha-bar-fill" id="pocha-bar-fill"></div>
              </div>
            </div>
          </div>
          <script>
          (function(){
            try {
              var vw0 = window.innerWidth || document.documentElement.clientWidth || 1280;
              var vh0 = window.innerHeight || document.documentElement.clientHeight || 720;
              var isMobInit = Boolean(
                (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
                (navigator.maxTouchPoints && navigator.maxTouchPoints > 1) ||
                /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|KAKAOTALK/i.test(navigator.userAgent || '') ||
                (vh0 > vw0) ||
                (vw0 < 960)
              );
              window.__pocha_is_mobile = isMobInit ? 1 : 0;
              window.__pocha_portrait = (vh0 > vw0) ? 1 : 0;
            } catch (e) {}
            window.__pochaAudioContexts = window.__pochaAudioContexts || [];
            var OrigAudioCtx = window.AudioContext || window.webkitAudioContext;
            if (OrigAudioCtx && !window.__pochaCtxHooked) {
              window.__pochaCtxHooked = true;
              var PatchedCtx = function() {
                var instance = new (Function.prototype.bind.apply(OrigAudioCtx, [null].concat(Array.prototype.slice.call(arguments))))();
                window.__pochaAudioContexts.push(instance);
                return instance;
              };
              PatchedCtx.prototype = OrigAudioCtx.prototype;
              window.AudioContext = PatchedCtx;
              if (window.webkitAudioContext) window.webkitAudioContext = PatchedCtx;
            }

            function unlockAllAudioContexts() {
              for (var i = 0; i < window.__pochaAudioContexts.length; i++) {
                var c = window.__pochaAudioContexts[i];
                if (c && c.state === "suspended") {
                  try { c.resume(); } catch (e) {}
                }
              }
              if (window.SDL2 && window.SDL2.audioContext && window.SDL2.audioContext.state === "suspended") {
                try { window.SDL2.audioContext.resume(); } catch (e) {}
              }
              if (window.__pochaAudio && typeof window.__pochaAudio.unlock === "function") {
                try { window.__pochaAudio.unlock(); } catch (e) {}
              }
            }
            var gestureEvents = ["pointerdown", "touchstart", "mousedown", "keydown", "click"];
            for (var g = 0; g < gestureEvents.length; g++) {
              window.addEventListener(gestureEvents[g], unlockAllAudioContexts, { capture: true, passive: true });
              document.addEventListener(gestureEvents[g], unlockAllAudioContexts, { capture: true, passive: true });
            }

            var themes = [
              {icons:["🐟","🔥","🥐"], msg:"황금빛 붕어빵 굽는 중...", color:"#ffa834"},
              {icons:["🍢","🍲","🍶"], msg:"뜨끈한 오뎅 육수 우리는 중...", color:"#46dcff"},
              {icons:["🍗","🔥","🌶️"], msg:"참숯 직화 닭꼬치 굽는 중...", color:"#ff6438"},
              {icons:["🌶️","🥘","🧀"], msg:"철판 모짜렐라 떡볶이 조리는 중...", color:"#ff5252"},
              {icons:["🐙","🥢","🥞"], msg:"오사카 타코야키 굴리는 중...", color:"#ffb93c"},
              {icons:["🌮","🥑","🌶️"], msg:"멕시코 화로 타코 굽는 중...", color:"#52e66e"},
              {icons:["🧋","🧊","🥞"], msg:"대만 흑당 버블티 준비 중...", color:"#dc8cff"},
              {icons:["🥘","🍢","🥟"], msg:"사천 마라탕 & 양꼬치 준비 중...", color:"#ff4c4c"}
            ];
            var idx = 0, pct = 16;
            var animTimer = setInterval(function(){
              idx = (idx + 1) % themes.length;
              pct = Math.min(95, pct + 11);
              var t = themes[idx];
              var art = document.getElementById("pocha-boot-art");
              var msg = document.getElementById("pocha-boot-msg");
              var fill = document.getElementById("pocha-bar-fill");
              var steps = document.getElementById("pocha-boot-steps");
              if (!art) { clearInterval(animTimer); return; }
              art.innerHTML = '<span class="pocha-boot-icon">' + t.icons[0] + '</span>' +
                              '<span class="pocha-boot-icon">' + t.icons[1] + '</span>' +
                              '<span class="pocha-boot-icon">' + t.icons[2] + '</span>';
              if (msg) msg.textContent = t.msg;
              if (fill) fill.style.width = pct + "%";
              if (steps && steps.children) {
                for (var s = 0; s < steps.children.length; s++) {
                  steps.children[s].className = (s === idx) ? "pocha-step-chip active" : "pocha-step-chip";
                }
              }
            }, 650);

            function dismissBootLoader() {
              var cvs = document.getElementById("canvas");
              if (cvs) cvs.classList.add("pocha-canvas-ready");
              var loader = document.getElementById("pocha-boot-loader");
              if (loader && !loader.__dismissed) {
                loader.__dismissed = true;
                var fill = document.getElementById("pocha-bar-fill");
                if (fill) fill.style.width = "100%";
                loader.style.opacity = "0";
                loader.style.pointerEvents = "none";
                setTimeout(function(){
                  if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
                }, 360);
              }
              clearInterval(animTimer);
            }

            window.__dismissPochaBootLoader = dismissBootLoader;

            function suppressPygbagGreenBox() {
              if (window.MM) {
                window.MM.ume = true;
              }
              var ids = ["box", "dlg", "pyconsole", "system", "transfer", "status", "progress"];
              for (var i = 0; i < ids.length; i++) {
                var el = document.getElementById(ids[i]);
                if (el) {
                  el.style.display = "none";
                  el.style.visibility = "hidden";
                  el.style.pointerEvents = "none";
                }
              }
              if (window.__pocha_first_frame_drawn) {
                dismissBootLoader();
              }
            }
            suppressPygbagGreenBox();
            var iv = setInterval(suppressPygbagGreenBox, 60);
            setTimeout(function(){
              dismissBootLoader();
              clearInterval(iv);
            }, 18000);
          })();
          </script>
          """
              if "</body>" in html:
                  html = html.replace("</body>", clean_snippet + "\n</body>")
              else:
                  html += clean_snippet
              index_path.write_text(html, encoding="utf-8")
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload WebApp Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-webapp:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-webapp
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
