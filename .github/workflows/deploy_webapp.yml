name: Build & Deploy Pocha Tycoon WebApp (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag & Pygame-ce
        run: |
          python -m pip install --upgrade pip
          pip install pygbag pygame-ce

      - name: Prepare clean WebApp bundle directory
        run: |
          rm -f requirements.txt *.bat *.spec *.exe

      - name: Build WebAssembly WebApp with Pygbag
        run: |
          pygbag --build --app_name "pocha_tycoon" --title "World Street Food Pocha Tycoon" .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload WebApp Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-webapp:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-webapp
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
