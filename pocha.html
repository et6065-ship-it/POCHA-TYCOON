<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d18" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-launcher-192.png" />
  <title>🐟 전설의 붕어빵 타이쿤 : 수직 4단계 포트레이트 에디션</title>
  <script src="./src/js/launcher_common.js"></script>
  <style>
    :root {
      --bg-dark: #080b14;
      --gold: #fbbf24;
      --green: #22c55e;
      --cyan: #06b6d4;
      --red: #ef4444;
      --text: #f8fafc;
      --sub: #94a3b8;
      --app-fit-bottom-reserve: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #05070e;
      color: var(--text);
      overflow: hidden;
      touch-action: none;
    }

    /* =====================================================================
       반응형 9:16 ~ 9:21 포트레이트 래퍼 (V-Stretch 상·하 배경 확장 적용)
       - 스마트폰이 9:19.5 ~ 9:21로 길어져도 코어 4단계 영역은 9:16 황금비율을 유지하고,
         남는 상하 공간은 [최상단 포차 간판/밤하늘]과 [최하단 포장마차 원목 앞판]이 자연스럽게 채움!
       ===================================================================== */
    .portrait-viewport {
      width: min(100vw, 540px);
      height: 100%;
      height: 100dvh;
      margin: 0 auto;
      padding-bottom: clamp(0px, calc(100dvh - 440px), var(--app-fit-bottom-reserve, 12px));
      display: flex;
      flex-direction: column;
      background: #090d18;
      border-left: 1px solid rgba(251, 191, 36, 0.25);
      border-right: 1px solid rgba(251, 191, 36, 0.25);
      position: relative;
      overflow: hidden;
    }

    /* 상단 V-Stretch 확장 영역: 가게 간판 / 겨울 밤하늘 / 어닝 천막 */
    .v-stretch-top {
      flex: 1 1 0;
      min-height: env(safe-area-inset-top, 0px);
      max-height: 72px;
      background:
        repeating-linear-gradient(
          90deg,
          #b91c1c 0px,
          #b91c1c 22px,
          #fef08a 22px,
          #fef08a 44px
        );
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      border-bottom: 3px solid #78350f;
      box-shadow: inset 0 -10px 18px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    .v-stretch-top::before {
      content: "🏮 청춘 황금 붕어빵 포차 · 겉바속촉 수제 통단팥 🏮";
      width: 100%;
      text-align: center;
      font-size: 11px;
      font-weight: 900;
      color: #fde047;
      background: rgba(9, 13, 24, 0.82);
      padding: 2px 0;
      letter-spacing: 0.04em;
    }

    /* 하단 V-Stretch 확장 영역: 포장마차 매대 하단 원목 앞판 텍스처 */
    .v-stretch-bottom {
      flex: 1 1 0;
      min-height: env(safe-area-inset-bottom, 0px);
      max-height: 72px;
      background:
        repeating-linear-gradient(
          90deg,
          #2e190d 0px,
          #2e190d 32px,
          #231208 32px,
          #231208 35px
        );
      border-top: 3px solid #78350f;
      box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(253, 224, 71, 0.45);
      font-size: 10.5px;
      font-weight: 800;
    }

    /* =====================================================================
       코어 9:16 수직 4단계 레이아웃 컨테이너 (10% / 25% / 25% / 40%)
       ===================================================================== */
    .core-9x16-stage {
      width: 100%;
      flex: 1 1 auto;
      max-height: calc(min(100vw, 540px) * 16 / 9);
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: #0d1322;
    }
    @media (max-height: 760px) {
      .v-stretch-top, .v-stretch-bottom {
        display: none;
      }
      .core-9x16-stage {
        max-height: none;
        min-height: 0;
      }
    }

    /* ---------------------------------------------------------------------
       [1단계: 0% ~ 10% (높이 10%)] 스테이지 현황 & 정적 UI
       - 매출(골드), 챕터 목표 달성률 게이지, 남은 피버/시간, 상점·빌딩·스토리 버튼
       --------------------------------------------------------------------- */
    .zone-1-hud {
      height: 10%;
      min-height: 54px;
      padding: 4px 10px;
      background: linear-gradient(180deg, #141c30 0%, #0f1526 100%);
      border-bottom: 2px solid rgba(251, 191, 36, 0.45);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
      z-index: 20;
    }

    .hud-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .hud-gold {
      font-size: 16px;
      font-weight: 900;
      color: var(--gold);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hud-static-btns {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hud-btn {
      height: 26px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1.5px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      white-space: nowrap;
    }
    .hud-btn.gold { border-color: var(--gold); background: #451a03; color: #fef08a; }
    .hud-btn.cyan { border-color: var(--cyan); background: #083344; color: #cffafe; }
    .hud-btn.clear-ready {
      border-color: #86efac;
      background: #16a34a;
      color: #fff;
      animation: pulseGlow 0.65s infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: scale(1); box-shadow: 0 0 4px #22c55e; }
      to { transform: scale(1.06); box-shadow: 0 0 12px #4ade80; }
    }

    .hud-bottom-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .goal-progress-wrap {
      flex: 1;
      height: 16px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .goal-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b 0%, #22c55e 100%);
      transition: width 0.2s;
    }
    .goal-progress-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 2px #000;
      white-space: nowrap;
    }

    .combo-pill {
      padding: 1px 7px;
      border-radius: 999px;
      background: #3b0764;
      border: 1px solid #c084fc;
      color: #f3e8ff;
      font-size: 10.5px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* ---------------------------------------------------------------------
       [2단계: 10% ~ 35% (높이 25%)] 카운터 & 손님 대기열 (시각 모니터링 구역)
       - 손님 3명 대기 슬롯, 주문 말풍선, 실시간 인내심 게이지
       --------------------------------------------------------------------- */
    .zone-2-customers {
      height: 25%;
      padding: 6px 8px;
      background: linear-gradient(180deg, #0c1428 0%, #162238 72%, #243048 100%);
      border-bottom: 3px solid #475569;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .street-header-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      color: #93c5fd;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .customer-slots-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      align-items: stretch;
      padding-top: 3px;
    }

    .cust-slot-card {
      background: rgba(15, 23, 42, 0.86);
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 5px 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }
    .cust-slot-card.match-ready {
      border-color: #4ade80;
      box-shadow: inset 0 0 10px rgba(34, 197, 94, 0.28);
    }
    .cust-slot-card.urgent {
      border-color: #ef4444;
    }

    /* 주문 말풍선 */
    .order-bubble {
      background: #f8fafc;
      color: #0f172a;
      border-radius: 8px;
      padding: 4px 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }
    .order-icon-badge {
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }
    .order-qty-tag {
      padding: 1px 5px;
      border-radius: 5px;
      background: #0f172a;
      color: #fde047;
      font-size: 11px;
      font-weight: 900;
    }

    /* 손님 얼굴 + 이름 + 가격 */
    .cust-body-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }
    .cust-emoji {
      font-size: 22px;
      line-height: 1;
    }
    .cust-info-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }
    .cust-name-lbl {
      font-size: 11px;
      font-weight: 900;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cust-price-lbl {
      font-size: 11px;
      font-weight: 900;
      color: var(--gold);
    }

    /* 실시간 인내심 게이지 */
    .patience-track {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 2px;
    }
    .patience-fill {
      height: 100%;
      width: 100%;
      background: #22c55e;
      transition: width 0.1s linear;
    }

    /* ---------------------------------------------------------------------
       [3단계: 35% ~ 60% (높이 25%)] 완성품 진열대 & 서빙존 (인터랙션 연계 완충 구역)
       - 구워진 붕어빵 스택 진열대 + 종이봉투 포장대
       - 탭(원터치) 또는 위로 짧게 플릭(Flick) 시 주문 손님에게 오토 타겟팅 비행 서빙!
       --------------------------------------------------------------------- */
    .zone-3-serving-rack {
      height: 25%;
      padding: 6px 10px;
      background: linear-gradient(180deg, #1c2436 0%, #131929 100%);
      border-bottom: 3px solid #78350f;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 5px;
      position: relative;
      flex-shrink: 0;
    }

    .rack-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 900;
      color: #fde68a;
      flex-shrink: 0;
    }
    .rack-sub-hint {
      font-size: 10.5px;
      font-weight: 800;
      color: #67e8f9;
    }

    .rack-main-grid {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    /* 맛별 완성품 보온 스택 슬롯들 */
    .stack-trays-wrap {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .stack-tray-slot {
      background: #0f1626;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      position: relative;
      transition: transform 0.08s, border-color 0.15s;
    }
    .stack-tray-slot.has-stock {
      border-color: #fbbf24;
      background: #231c10;
    }
    .stack-tray-slot.order-wanted {
      border-color: #4ade80;
      background: #0d2e1b;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.35);
    }
    .stack-tray-slot:active {
      transform: translateY(-4px) scale(0.97);
    }

    .stack-fish-visual {
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .stack-name {
      font-size: 11px;
      font-weight: 900;
      color: #e2e8f0;
      white-space: nowrap;
    }
    .stack-count-badge {
      padding: 1px 7px;
      border-radius: 999px;
      background: #1e293b;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 900;
    }
    .stack-tray-slot.has-stock .stack-count-badge {
      background: #f59e0b;
      color: #090d16;
    }
    .stack-tray-slot.order-wanted .stack-count-badge {
      background: #22c55e;
      color: #052e16;
    }

    /* 우측 종이봉투 원터치 오토 서빙 포장대 */
    .auto-pack-station {
      width: 106px;
      border-radius: 12px;
      border: 2px solid #475569;
      background: #1e293b;
      color: #94a3b8;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      flex-shrink: 0;
      text-align: center;
    }
    .auto-pack-station.can-pack {
      border-color: #86efac;
      background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
      color: #fff;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.5);
    }
    .auto-pack-station:active {
      transform: scale(0.95);
    }

    /* ---------------------------------------------------------------------
       [4단계: 60% ~ 100% (높이 40%)] 조리대 & 원터치 컨트롤존 (하단 엄지 도달 구역)
       - 블록형 그리드(2×2, 3×2, 3×3) 양면 주물 불판 + 반죽/앙금 투입구
       - 우측 하단 모서리 쓰레기통(폐기) 고정 앵커링 (오터치 폐기 대참사 방지!)
       --------------------------------------------------------------------- */
    .zone-4-thumb-cooking {
      height: 40%;
      padding: 6px 10px 8px;
      background: #0b0f1c;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      position: relative;
      flex-shrink: 0;
    }

    /* 상단 원터치 조리 보조 컨트롤 바 */
    .mold-quick-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      flex-shrink: 0;
    }

    .thumb-act-btn {
      flex: 1;
      height: 32px;
      border-radius: 8px;
      border: 1.5px solid #334155;
      font-size: 11.5px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
    }
    .thumb-act-btn.pour { background: #451a03; border-color: #f59e0b; color: #fde68a; }
    .thumb-act-btn.flip { background: #083344; border-color: #06b6d4; color: #a5f3fc; }
    .thumb-act-btn.up-rack { background: #052e16; border-color: #22c55e; color: #bbf7d0; }
    .thumb-act-btn:active { transform: scale(0.96); }

    /* 중앙 블록형 그리드 주물 불판 캔버스 */
    .mold-canvas-container {
      flex: 1;
      min-height: 72px;
      width: 100%;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
    }

    #mold-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* 최하단 반죽/앙금 투입구 + 우측 모서리 고정 쓰레기통(폐기) */
    .thumb-bottom-dock {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .ingredient-Dispenser {
      flex: 1;
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 1px;
    }

    .ing-btn {
      flex: 1;
      min-width: 74px;
      height: 40px;
      padding: 0 8px;
      border-radius: 9px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .ing-btn.active {
      border-color: var(--gold);
      background: #422006;
      color: #fef08a;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.35);
    }

    /* 우측 하단 모서리 고정 쓰레기통 (조리대와 분리하여 실수로 버리는 사고 방지!) */
    .corner-trash-btn {
      width: 58px;
      height: 40px;
      border-radius: 9px;
      border: 2px solid #475569;
      background: #1f2430;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: 2px;
    }
    .corner-trash-btn.trash-active {
      border-color: #ef4444;
      background: #7f1d1d;
      color: #fecaca;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    /* 비행 디쉬(오토 타겟팅 서빙 애니메이션) 레이어 */
    .flying-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 90;
      overflow: hidden;
    }
    .flying-item {
      position: absolute;
      font-size: 24px;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 2px 6px #000;
      transform: translate(-50%, -50%);
      transition: transform 0.32s cubic-bezier(0.2, 0.85, 0.35, 1), opacity 0.32s;
      white-space: nowrap;
    }

    /* =====================================================================
       팝업 시트 모달 (스토리 / 설비·출장 상점 / 강남 5층 빌딩)
       ===================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 16, 0.92);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: min(480px, 96vw);
      max-height: 90dvh;
      background: #141c30;
      border: 3px solid var(--gold);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px #000;
    }

    .modal-head {
      padding: 12px 14px;
      background: #1e293b;
      border-bottom: 2px solid rgba(251, 191, 36, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .modal-head h2 {
      font-size: 14.5px;
      font-weight: 900;

    // =========================================================================

    function loadGame() {

    // =========================================================================
    // 5. 효과음
    // =========================================================================
    let actx = null;
    function tone(freq, dur = 0.07, type = "sine", vol = 0.11) {
      try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === "suspended") actx.resume();
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, actx.currentTime);
        g.gain.setValueAtTime(vol, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
        o.connect(g);
        g.connect(actx.destination);
        o.start();
        o.stop(actx.currentTime + dur);
      } catch (e) {}
    }
    const sfxPour = () => tone(350, 0.06, "triangle");
    const sfxFlip = () => tone(490, 0.06, "square");
    const sfxHarvest = () => { tone(660, 0.06); setTimeout(() => tone(880, 0.09), 40); };
    const sfxCash = () => { tone(784, 0.07, "triangle"); setTimeout(() => tone(1046, 0.13, "triangle"), 50); };
    const sfxTrash = () => tone(190, 0.1, "sawtooth");

    // =========================================================================
    // 6. 손님 3인 대기열 (2단계 영역: 10% ~ 35%)
    // =========================================================================
    const CUST_POOL = [
      { name: "공시생 지은", emoji: "👩‍🎓" },
      { name: "김대리", emoji: "👨‍💼" },

      { name: "단골 여대생", emoji: "🧣" }
    ];

    function spawnCustomerAt(idx) {
      const pick = CUST_POOL[Math.floor(Math.random() * CUST_POOL.length)];
      const avail = FILLINGS.filter(f => state.unlockedFillings.includes(f.id));
      const fill = avail[Math.floor(Math.random() * avail.length)] || FILLINGS[0];
      const qty = 1 + Math.floor(Math.random() * 2);
      state.customers[idx] = {
        slotIdx: idx,
        name: pick.name,
        emoji: pick.emoji,
        fillingId: fill.id,
        qty,
        patience: 32,
        maxPatience: 32
      };
    }

    function ensureCustomers() {
      for (let i = 0; i < 3; i++) {
        if (!state.customers[i]) spawnCustomerAt(i);
      }
    }

    function getUnitPrice(fid) {
      const f = FILLINGS.find(x => x.id === fid) || FILLINGS[0];
      const m = MOLDS[state.currentMoldIdx] || MOLDS[0];
      const reg = REGIONS.find(r => r.id === state.currentRegionId) || REGIONS[0];
      let mult = m.priceMult * reg.mult;
      if (state.licensed) mult *= 1.3;
      if (state.buildingFloor >= 1) mult *= 1.3;
      if (state.buildingFloor >= 4) mult *= 1.5;
      return Math.round(f.price * mult);
    }

    // =========================================================================
    // 7. 오토 타겟팅 서빙 (3단계 진열대 탭/플릭 -> 2단계 주문 손님에게 자동 비행!)
    // =========================================================================
    function spawnFlyingEffect(startX, startY, endX, endY, labelText) {
      const layer = document.getElementById("flying-layer");
      const stageRect = document.getElementById("core-stage").getBoundingClientRect();
      const el = document.createElement("div");
      el.className = "flying-item";
      el.textContent = labelText;
      el.style.left = `${startX - stageRect.left}px`;
      el.style.top = `${startY - stageRect.top}px`;
      layer.appendChild(el);

      requestAnimationFrame(() => {
        const dx = endX - startX;
        const dy = endY - startY;
        el.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.12)`;
        el.style.opacity = "0.15";
      });
      setTimeout(() => el.remove(), 340);
    }

    function tryAutoServeByFilling(fillingId, startClientX, startClientY) {
      // 해당 맛을 주문한 대기 손님 중 인내심이 가장 급한 손님 최우선 타겟팅!
      const candidates = state.customers
        .filter(c => c && c.fillingId === fillingId && (state.stock[fillingId] || 0) >= c.qty)
        .sort((a, b) => (a.patience / a.maxPatience) - (b.patience / b.maxPatience));

      if (candidates.length === 0) return false;
      const target = candidates[0];
      state.stock[fillingId] -= target.qty;
      state.combo += 1;
      const bonus = 1 + Math.min(0.5, state.combo * 0.05);
      const earned = Math.round(getUnitPrice(fillingId) * target.qty * bonus);
      state.gold += earned;
      sfxCash();

      const slotEls = document.querySelectorAll(".cust-slot-card");
      const targetEl = slotEls[target.slotIdx];
      if (targetEl) {
        const tr = targetEl.getBoundingClientRect();
        spawnFlyingEffect(
          startClientX || window.innerWidth / 2,
          startClientY || window.innerHeight * 0.48,
          tr.left + tr.width / 2,
          tr.top + tr.height / 2,
          `🛍️ +${earned.toLocaleString()}원!`
        );
      }

      spawnCustomerAt(target.slotIdx);
      updateUI();
      saveGame();
      return true;
    }

    function tryAutoServeAny(startClientX, startClientY) {
      for (const f of FILLINGS) {
        if (tryAutoServeByFilling(f.id, startClientX, startClientY)) return true;
      }
      return false;
    }

    // =========================================================================
    // 8. 4단계 블록형 그리드 주물 불판 (60% ~ 100% 엄지 도달 구역)
    // =========================================================================
    const canvas = document.getElementById("mold-canvas");
    const ctx = canvas.getContext("2d");

    function getMold() {
      return MOLDS[state.currentMoldIdx] || MOLDS[0];
    }

    function syncSlots() {
      const m = getMold();
      while (state.slots.length < m.slots) {
        state.slots.push({
          state: "IDLE", // IDLE, FRONT, FLIP_READY, BACK, READY, BURNT
          fillingId: "redbean",
          progress: 0,
          burnTimer: 0,
          rect: { x: 0, y: 0, w: 0, h: 0 }
        });
      }
      if (state.slots.length > m.slots) state.slots.length = m.slots;
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const r = canvas.getBoundingClientRect();
      if (r.width < 10 || r.height < 10) return;
      canvas.width = Math.floor(r.width * dpr);
      canvas.height = Math.floor(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);

    function drawFishGraphic(cx, cy, rx, ry, bodyCol, rimCol, mode, fillingId) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx + rx * 0.36, cy);
      ctx.lineTo(cx + rx * 0.98, cy - ry * 0.68);
      ctx.lineTo(cx + rx * 0.84, cy);
      ctx.lineTo(cx + rx * 0.98, cy + ry * 0.68);
      ctx.closePath();
      ctx.fillStyle = bodyCol;
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = rimCol;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(cx - rx * 0.14, cy, rx * 0.74, ry * 0.76, 0, 0, Math.PI * 2);
      ctx.fillStyle = bodyCol;
      ctx.fill();
      ctx.lineWidth = mode === "READY" ? 2.5 : 1.6;
      ctx.strokeStyle = rimCol;
      ctx.stroke();

      if (mode === "FRONT" || mode === "FLIP_READY") {
        const f = FILLINGS.find(x => x.id === fillingId) || FILLINGS[0];
        ctx.beginPath();
        ctx.ellipse(cx - rx * 0.14, cy, rx * 0.34, ry * 0.4, 0, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        ctx.fill();
      } else if (mode === "BACK" || mode === "READY") {
        ctx.fillStyle = "#27170c";
        ctx.beginPath();
        ctx.arc(cx - rx * 0.48, cy - ry * 0.15, Math.max(2, ry * 0.14), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderCanvas(tick) {
      const r = canvas.getBoundingClientRect();
      const w = r.width;
      const h = r.height;
      if (w < 10 || h < 10) return;
      ctx.clearRect(0, 0, w, h);

      const mold = getMold();
      const cols = mold.cols;
      const rows = mold.rows;
      const isGold = state.currentMoldIdx >= 3;

      // 상판 열린 뚜껑 (하판과 1:1 대칭되는 양면 개폐식 주물틀 헤더)
      const lidH = Math.max(36, Math.min(54, h * 0.2));
      const hingeH = 10;
      const plateY = lidH + hingeH;
      const plateH = h - plateY - 2;

      ctx.fillStyle = isGold ? "#423215" : "#1f2737";
      ctx.strokeStyle = isGold ? "#fbbf24" : "#64748b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(8, 2, w - 16, lidH - 2, 8);
      ctx.fill();
      ctx.stroke();

      const lidPadX = 14;
      const lidPadY = 4;
      const lidCellW = (w - 16 - lidPadX * 2 - (cols - 1) * 6) / cols;
      const lidCellH = (lidH - lidPadY * 2 - (rows - 1) * 3) / rows;
      for (let i = 0; i < mold.slots; i++) {
        const c = i % cols;
        const row = Math.floor(i / cols);
        const lx = 8 + lidPadX + c * (lidCellW + 6);
        const ly = 2 + lidPadY + row * (lidCellH + 3);
        ctx.fillStyle = "#111622";
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(lx, ly, lidCellW, lidCellH, 4);
        ctx.fill();
        ctx.stroke();
      }

      // 황동 경첩
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(6, lidH, w - 12, hingeH);
      for (let c = 0; c < cols; c++) {
        const hx = 22 + c * ((w - 44) / cols) + ((w - 44) / cols) * 0.5 - 14;
        ctx.fillStyle = "#d97706";
        ctx.fillRect(hx, lidH + 2, 28, hingeH - 4);
      }

      // 하판 블록형 그리드 주물 불판
      ctx.fillStyle = isGold ? "#3b2c12" : "#182030";
      ctx.strokeStyle = state.trashMode ? "#ef4444" : (isGold ? "#fbbf24" : "#64748b");
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(3, plateY, w - 6, plateH, 10);
      ctx.fill();
      ctx.stroke();

      const pad = 6;
      const cellW = (w - 20 - pad * (cols - 1)) / cols;
      const cellH = (plateH - 12 - pad * (rows - 1)) / rows;

      for (let i = 0; i < mold.slots; i++) {
        const sl = state.slots[i];
        const c = i % cols;
        const row = Math.floor(i / cols);
        const sx = 10 + c * (cellW + pad);
        const sy = plateY + 6 + row * (cellH + pad);
        sl.rect = { x: sx, y: sy, w: cellW, h: cellH };

        let bg = "#0f1420";
        let border = "#334155";
        let bw = 2;

        if (sl.state === "FLIP_READY") {
          bg = "#083344";
          border = Math.sin(tick * 10) > 0 ? "#22d3ee" : "#fbbf24";
          bw = 2.5;
        } else if (sl.state === "READY") {
          bg = "#14532d";
          border = "#4ade80";
          bw = 2.5;
        } else if (sl.state === "BURNT") {
          bg = "#3f1111";
          border = "#ef4444";
          bw = 2.5;
        }

        ctx.fillStyle = bg;
        ctx.strokeStyle = border;
        ctx.lineWidth = bw;
        ctx.beginPath();
        ctx.roundRect(sx, sy, cellW, cellH, 9);
        ctx.fill();
        ctx.stroke();

        const cx = sx + cellW * 0.5;
        const cy = sy + cellH * 0.4;
        const rx = Math.min(cellW * 0.34, 42);
        const ry = Math.min(cellH * 0.26, 22);

        let label = "";
        let labelCol = "#94a3b8";

        if (sl.state === "IDLE") {
          drawFishGraphic(cx, cy, rx, ry, "#1e293b", "#475569", "IDLE", null);
          label = "🥣 터치: 붓기";
          labelCol = "#cbd5e1";
        } else if (sl.state === "FRONT") {
          drawFishGraphic(cx, cy, rx, ry, "#fef3c7", "#d97706", "FRONT", sl.fillingId);
          label = `앞면 ${Math.min(99, Math.floor((sl.progress / 0.5) * 100))}%`;
          labelCol = "#fde047";
        } else if (sl.state === "FLIP_READY") {
          drawFishGraphic(cx, cy, rx, ry, "#fde68a", "#ea580c", "FLIP_READY", sl.fillingId);
          label = "🔄 뒤집기!";
          labelCol = "#67e8f9";
        } else if (sl.state === "BACK") {
          drawFishGraphic(cx, cy, rx, ry, "#ea580c", "#7c2d12", "BACK", sl.fillingId);
          label = `뒷면 ${Math.min(99, Math.floor(((sl.progress - 0.5) / 0.5) * 100))}%`;
          labelCol = "#fdba74";
        } else if (sl.state === "READY") {
          drawFishGraphic(cx, cy, rx, ry, "#facc15", "#b45309", "READY", sl.fillingId);
          label = "⬆️ 진열대로!";
          labelCol = "#86efac";
        } else if (sl.state === "BURNT") {
          drawFishGraphic(cx, cy, rx, ry, "#1c1917", "#7f1d1d", "BURNT", sl.fillingId);
          label = "🗑️ 탄 빵 폐기";
          labelCol = "#fca5a5";
        }

        ctx.fillStyle = labelCol;
        ctx.font = "900 11px Pretendard, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(label, cx, sy + cellH - 6);
      }

      for (let i = state.floats.length - 1; i >= 0; i--) {
        const ft = state.floats[i];
        ctx.fillStyle = ft.color;
        ctx.font = "900 13px Pretendard, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(ft.text, ft.x, ft.y);
      }
    }

    function addFloat(text, x, y, color = "#fef08a") {
      state.floats.push({ text, x, y, color, life: 0.75 });
    }

    // 슬롯 조작 & 위로 플릭(Flick)하여 3번 진열대로 올리기 지원
    function pourSlot(sl) {
      if (sl.state !== "IDLE") return false;
      sl.state = "FRONT";
      sl.fillingId = state.selectedFillingId;
      sl.progress = 0;
      sl.burnTimer = 0;
      return true;
    }

    function flipSlot(sl) {
      if (sl.state !== "FLIP_READY") return false;
      sl.state = "BACK";
      return true;
    }

    function moveSlotToRack(sl) {
      if (sl.state !== "READY") return false;
      const m = getMold();
      const bonus = m.yieldBonus || 1;
      state.stock[sl.fillingId] = (state.stock[sl.fillingId] || 0) + bonus;
      state.totalBaked += bonus;
      sl.state = "IDLE";
      sl.progress = 0;
      sl.burnTimer = 0;
      return true;
    }

    let pointerDownSlot = null;
    let pointerStartY = 0;

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      pointerStartY = e.clientY;
      pointerDownSlot = null;

      for (const sl of state.slots) {
        const r = sl.rect;
        if (x < r.x || x > r.x + r.w || y < r.y || y > r.y + r.h) continue;
        pointerDownSlot = sl;

        // 우측 하단 쓰레기통(폐기 모드)이 켜져 있거나 탄 빵(BURNT)일 때
        if (sl.state === "BURNT" || (state.trashMode && sl.state !== "IDLE")) {
          sl.state = "IDLE";
          sl.progress = 0;
          sl.burnTimer = 0;
          state.trashMode = false;
          sfxTrash();
          addFloat("🗑️ 폐기 완료", r.x + r.w / 2, r.y + 16, "#fca5a5");
          updateUI();
          return;
        }

        if (sl.state === "IDLE") {
          pourSlot(sl);
          sfxPour();
          addFloat("🥣 반죽+앙금!", r.x + r.w / 2, r.y + 16, "#bae6fd");
        } else if (sl.state === "FLIP_READY") {
          flipSlot(sl);
          sfxFlip();
          addFloat("🔄 뒤집기!", r.x + r.w / 2, r.y + 16, "#67e8f9");
        } else if (sl.state === "READY") {
          moveSlotToRack(sl);
          sfxHarvest();
          addFloat("⬆️ 진열대 적재!", r.x + r.w / 2, r.y + 16, "#4ade80");
          updateUI();
          saveGame();
        }
        return;
      }
    });

    canvas.addEventListener("pointerup", (e) => {
      if (!pointerDownSlot) return;
      const dy = e.clientY - pointerStartY;
      if (dy < -20 && pointerDownSlot.state === "READY") {
        moveSlotToRack(pointerDownSlot);
        sfxHarvest();
        updateUI();
        saveGame();
      }
      pointerDownSlot = null;
    });

    document.getElementById("btn-pour-all").onclick = () => {
      let c = 0;
      for (const sl of state.slots) if (pourSlot(sl)) c++;
      if (c > 0) sfxPour();
    };
    document.getElementById("btn-flip-all").onclick = () => {
      let c = 0;
      for (const sl of state.slots) if (flipSlot(sl)) c++;
      if (c > 0) sfxFlip();
    };
    document.getElementById("btn-harvest-all").onclick = () => {
      let c = 0;
      for (const sl of state.slots) if (moveSlotToRack(sl)) c++;
      if (c > 0) {
        sfxHarvest();
        updateUI();
        saveGame();
      }
    };

    // 우측 하단 모서리 고정 쓰레기통 (탄 빵은 즉시 제거, 아니면 폐기 선택 토글)
    document.getElementById("btn-corner-trash").onclick = () => {
      let clearedBurnt = 0;
      for (const sl of state.slots) {
        if (sl.state === "BURNT") {
          sl.state = "IDLE";
          sl.progress = 0;
          sl.burnTimer = 0;
          clearedBurnt++;
        }
      }
      if (clearedBurnt > 0) {
        sfxTrash();
        updateUI();
        return;
      }
      state.trashMode = !state.trashMode;
      sfxTrash();
      updateUI();
    };

    // =========================================================================
    // 9. 수직 4단계 전체 UI 동기화
    // =========================================================================
    function getCurrentChapter() {
      for (const ch of CHAPTERS) {
        if (!state.clearedIds.includes(ch.id)) return ch;
      }
      return null;
    }

    function triggerChapterClear(ch) {
      if (!ch || state.clearedIds.includes(ch.id)) return;
      state.clearedIds.push(ch.id);
      sfxCash();
      ch.onClear(state);
      saveGame();
      updateUI();
      openCutscene(ch.epKey);
    }

    function updateUI() {
      ensureCustomers();
      document.getElementById("gold-txt").textContent = state.gold.toLocaleString();
      document.getElementById("combo-txt").textContent = `🔥 ${state.combo}콤보`;

      const reg = REGIONS.find(r => r.id === state.currentRegionId) || REGIONS[0];
      document.getElementById("region-banner-txt").textContent = `📍 ${reg.name} (단가 ×${reg.mult})`;
      document.getElementById("building-badge-txt").textContent = `🏢 강남 빌딩 ${state.buildingFloor}/5층`;

      // 1단계: 챕터 진행률 게이지 바
      const ch = getCurrentChapter();
      const storyBtn = document.getElementById("btn-open-story");
      const goalFill = document.getElementById("goal-fill");
      const goalTxt = document.getElementById("goal-txt");

      if (!ch) {
        goalFill.style.width = "100%";
        goalTxt.textContent = "👑 강남 5층 황금 붕어 타워 건물주 엔딩 달성!";
        storyBtn.className = "hud-btn cyan";
        storyBtn.textContent = "📖 스토리";
      } else {
        const p = ch.getProg(state);
        const ratio = Math.min(100, Math.round((p.cur / p.max) * 100));
        const ready = p.cur >= p.max;
        goalFill.style.width = `${ratio}%`;
        goalTxt.textContent = ready
          ? `🎉 [${ch.name}] 달성! 터치하여 클리어 & 보상 받기 ▶`
          : `🎯 ${ch.name}: ${ch.goalDesc} (${p.cur}/${p.max})`;
        storyBtn.className = `hud-btn ${ready ? "clear-ready" : "cyan"}`;
        storyBtn.textContent = ready ? "🎉 클리어!" : "📖 스토리";
      }

      // 2단계: 손님 3인 대기열 렌더링
      const custGrid = document.getElementById("customer-grid");
      custGrid.innerHTML = "";
      for (let i = 0; i < 3; i++) {
        const c = state.customers[i];
        if (!c) continue;
        const f = FILLINGS.find(x => x.id === c.fillingId) || FILLINGS[0];
        const canFulfill = (state.stock[c.fillingId] || 0) >= c.qty;
        const pRatio = Math.max(0, Math.min(1, c.patience / c.maxPatience));
        const pay = getUnitPrice(c.fillingId) * c.qty;

        const card = document.createElement("div");
        card.className = `cust-slot-card ${canFulfill ? "match-ready" : ""} ${pRatio < 0.28 ? "urgent" : ""}`;
        card.innerHTML = `
          <div class="order-bubble">
            <span class="order-icon-badge">${f.icon} ${f.shortName}</span>
            <span class="order-qty-tag">×${c.qty}</span>
          </div>
          <div class="cust-body-row">
            <span class="cust-emoji">${c.emoji}</span>
            <div class="cust-info-col">
              <span class="cust-name-lbl">${c.name}</span>
              <span class="cust-price-lbl">+${pay.toLocaleString()}원</span>
            </div>
          </div>
          <div class="patience-track">
            <div class="patience-fill" style="width:${Math.round(pRatio * 100)}%;background:${pRatio > 0.5 ? "#22c55e" : pRatio > 0.25 ? "#f59e0b" : "#ef4444"};"></div>
          </div>
        `;
        card.onclick = (e) => {
          tryAutoServeByFilling(c.fillingId, e.clientX, e.clientY);
        };
        custGrid.appendChild(card);
      }

      // 3단계: 완성품 진열대 & 서빙존 (탭 또는 위로 플릭 시 오토 타겟팅 서빙!)
      const stackGrid = document.getElementById("stack-trays-grid");
      stackGrid.innerHTML = "";
      let anyCanPack = false;

      for (const f of FILLINGS) {
        const count = state.stock[f.id] || 0;
        const wanted = state.customers.some(c => c && c.fillingId === f.id && count >= c.qty);
        if (wanted) anyCanPack = true;

        const tray = document.createElement("div");
        tray.className = `stack-tray-slot ${count > 0 ? "has-stock" : ""} ${wanted ? "order-wanted" : ""}`;
        const fishIcons = count > 0 ? "🐟".repeat(Math.min(3, count)) : "🍽️";
        tray.innerHTML = `
          <div class="stack-fish-visual">${fishIcons}</div>
          <div class="stack-name">${f.icon} ${f.shortName}</div>
          <div class="stack-count-badge">${wanted ? `서빙 가능! (${count}개)` : `${count}개 적재`}</div>
        `;

        let startY = 0;
        tray.onpointerdown = (e) => {
          startY = e.clientY;
        };
        tray.onpointerup = (e) => {
          const dy = e.clientY - startY;
          if (dy <= 15) {
            tryAutoServeByFilling(f.id, e.clientX, e.clientY);
          }
        };
        stackGrid.appendChild(tray);
      }

      const packBtn = document.getElementById("btn-auto-pack");
      packBtn.className = `auto-pack-station ${anyCanPack ? "can-pack" : ""}`;
      document.getElementById("pack-main-lbl").textContent = anyCanPack ? "⚡ 즉시 서빙!" : "포장 대기";
      document.getElementById("pack-sub-lbl").textContent = anyCanPack ? "터치 시 자동 발송" : "빵을 구워주세요";
      packBtn.onclick = (e) => tryAutoServeAny(e.clientX, e.clientY);

      // 4단계 하단: 속재료(앙금) 투입구 & 우측 모서리 쓰레기통
      const ingBar = document.getElementById("ingredient-bar");
      ingBar.innerHTML = "";
      for (const f of FILLINGS) {
        if (!state.unlockedFillings.includes(f.id)) continue;
        const b = document.createElement("button");
        b.type = "button";
        b.className = `ing-btn ${state.selectedFillingId === f.id ? "active" : ""}`;
        b.textContent = `${f.name}`;
        b.onclick = () => {
          state.selectedFillingId = f.id;
          state.trashMode = false;
          sfxPour();
          updateUI();
        };
        ingBar.appendChild(b);
      }

      const trashBtn = document.getElementById("btn-corner-trash");
      trashBtn.className = `corner-trash-btn ${state.trashMode ? "trash-active" : ""}`;
      document.getElementById("trash-lbl").textContent = state.trashMode ? "슬롯선택" : "폐기";
    }

    document.getElementById("goal-bar-click").onclick = () => {
      const ch = getCurrentChapter();
      if (ch) {
        const p = ch.getProg(state);
        if (p.cur >= p.max) {
          triggerChapterClear(ch);
          return;
        }
      }
      openStoryModal();
    };

    // =========================================================================
    // 10. 상점(블록 주물틀 · 전국 출장 · 강남 5층 빌딩) & 스토리 모달
    // =========================================================================
    function renderShopModal() {
      const body = document.getElementById("shop-modal-body");
      body.innerHTML = "";

      if (state.shopTab === "mold") {
        const albaRow = document.createElement("div");
        albaRow.className = `card-row ${state.autoAlba ? "owned" : "highlight"}`;
        albaRow.innerHTML = `
          <div class="card-info">
            <h3>👩‍🍳 김민지 포장 전담 매니저 고용</h3>
            <p>3번 진열대에 빵이 올라오면 손님에게 100% 자동으로 포장·서빙합니다!</p>
          </div>
        `;
        const ab = document.createElement("button");
        ab.className = "buy-btn";
        ab.textContent = state.autoAlba ? "✔ 고용 중" : "30,000원 고용";
        ab.disabled = state.autoAlba || state.gold < 30000;
        ab.onclick = () => {
          state.gold -= 30000;
          state.autoAlba = true;
          sfxCash();
          saveGame();
          updateUI();
          renderShopModal();
        };
        albaRow.appendChild(ab);
        body.appendChild(albaRow);

        for (let i = 0; i < MOLDS.length; i++) {
          const m = MOLDS[i];
          const owned = state.ownedMolds.includes(m.id);
          const eq = state.currentMoldIdx === i;
          const row = document.createElement("div");
          row.className = `card-row ${owned ? "owned" : ""}`;
          row.innerHTML = `
            <div class="card-info">
              <h3>🔥 ${m.name}</h3>
              <p>${m.desc}</p>
            </div>
          `;
          const btn = document.createElement("button");
          btn.className = "buy-btn";
          if (eq) {
            btn.textContent = "✔ 장착 중";
            btn.disabled = true;
          } else if (owned) {
            btn.textContent = "장착하기";
            btn.onclick = () => {
              state.currentMoldIdx = i;
              syncSlots();
              saveGame();
              updateUI();
              renderShopModal();
            };
          } else {
            btn.textContent = `${m.cost.toLocaleString()}원 구매`;
            btn.disabled = state.gold < m.cost;
            btn.onclick = () => {
              state.gold -= m.cost;
              state.ownedMolds.push(m.id);
              state.currentMoldIdx = i;
              syncSlots();
              sfxCash();
              saveGame();
              updateUI();
              renderShopModal();
              if (i === 1) openCutscene("ep2_5_mold_craft");
            };
          }
          row.appendChild(btn);
          body.appendChild(row);
        }
      } else if (state.shopTab === "region") {
        for (const reg of REGIONS) {
          const isCur = state.currentRegionId === reg.id;
          const row = document.createElement("div");
          row.className = `card-row ${isCur ? "owned" : ""}`;
          row.innerHTML = `
            <div class="card-info">
              <h3>🚚 ${reg.name} (단가 ×${reg.mult})</h3>
              <p>${reg.desc}</p>
            </div>
          `;
          const btn = document.createElement("button");
          btn.className = "buy-btn";
          if (isCur) {
            btn.textContent = "✔ 영업 중";
            btn.disabled = true;
          } else {
            btn.textContent = reg.cost === 0 ? "이동하기" : `${reg.cost.toLocaleString()}원 출장`;
            btn.disabled = state.gold < reg.cost;
            btn.onclick = () => {
              state.gold -= reg.cost;
              state.currentRegionId = reg.id;
              sfxCash();
              saveGame();
              updateUI();
              renderShopModal();
            };
          }
          row.appendChild(btn);
          body.appendChild(row);
        }
      } else {
        for (let idx = BUILDINGS.length - 1; idx >= 0; idx--) {
          const b = BUILDINGS[idx];
          const built = state.buildingFloor >= b.floor;
          const isNext = state.buildingFloor === b.floor - 1;
          const row = document.createElement("div");
          row.className = `card-row ${built ? "owned" : isNext ? "highlight" : ""}`;
          row.innerHTML = `
            <div class="card-info">
              <h3>${b.name}</h3>
              <p>${b.desc}</p>
              <p style="color:#fbbf24;font-weight:900;">🏢 분양·증축 금액: ${b.cost.toLocaleString()}원</p>
            </div>
          `;
          const btn = document.createElement("button");
          btn.className = `buy-btn ${isNext ? "green" : ""}`;
          if (built) {
            btn.textContent = `✔ ${b.floor}층 완공`;
            btn.disabled = true;
          } else if (!isNext) {
            btn.textContent = `${b.floor - 1}층 먼저`;
            btn.disabled = true;
          } else {
            btn.textContent = `${b.cost.toLocaleString()}원 건설`;
            btn.disabled = state.gold < b.cost;
            btn.onclick = () => {
              state.gold -= b.cost;
              state.buildingFloor = b.floor;
              sfxCash();
              saveGame();
              updateUI();
              renderShopModal();
              if (b.floor === 5) triggerChapterClear(CHAPTERS[4]);
            };
          }
          row.appendChild(btn);
          body.appendChild(row);
        }
      }
    }

    document.querySelectorAll(".modal-tab").forEach(tab => {
      tab.onclick = () => {
        state.shopTab = tab.dataset.stab;
        document.querySelectorAll(".modal-tab").forEach(t => t.classList.toggle("active", t === tab));
        renderShopModal();
      };
    });

    document.getElementById("btn-open-shop").onclick = () => {
      renderShopModal();
      document.getElementById("shop-modal").classList.add("open");
    };
    document.getElementById("btn-close-shop").onclick = () => {
      document.getElementById("shop-modal").classList.remove("open");
    };

    function openCutscene(epKey) {
      state.activeEpKey = epKey;
      state.activeLineIdx = 0;
      renderStoryModal();
      document.getElementById("story-modal").classList.add("open");
    }

    function openStoryModal() {
      state.activeEpKey = null;
      renderStoryModal();
      document.getElementById("story-modal").classList.add("open");
    }

    function renderStoryModal() {
      const body = document.getElementById("story-modal-body");
      body.innerHTML = "";

      if (state.activeEpKey && EPISODES[state.activeEpKey]) {
        const ep = EPISODES[state.activeEpKey];
        const line = ep.lines[state.activeLineIdx] || ep.lines[0];
        document.getElementById("story-modal-title").textContent = ep.title;

        const wrap = document.createElement("div");
        wrap.style.display = "flex";
        wrap.style.flexDirection = "column";
        wrap.style.gap = "10px";
        wrap.innerHTML = `
          <div class="cutscene-img"><img src="${ep.img}" alt="스토리 삽화" /></div>
          <div class="cutscene-box">
            <span class="speaker-pill">${line.speaker}</span>
            <p style="font-size:13.5px;line-height:1.5;color:#f8fafc;min-height:54px;">${line.text}</p>
            <div style="display:flex;justify-content:space-between;align-items:center;padding-top:6px;border-top:1px solid #334155;">
              <span style="font-size:11.5px;color:#94a3b8;">${state.activeLineIdx + 1} / ${ep.lines.length} (터치하여 진행)</span>
              <button type="button" class="buy-btn green">${state.activeLineIdx + 1 >= ep.lines.length ? "영업 계속하기 ▶" : "다음 대사 ▶"}</button>
            </div>
          </div>
        `;
        wrap.onclick = () => {
          if (state.activeLineIdx + 1 < ep.lines.length) {
            state.activeLineIdx++;
            sfxPour();
            renderStoryModal();
          } else {
            state.activeEpKey = null;
            document.getElementById("story-modal").classList.remove("open");
          }
        };
        body.appendChild(wrap);
        return;
      }

      document.getElementById("story-modal-title").textContent = "📖 스토리 챕터 진행 & 즉시 클리어";
      for (const ch of CHAPTERS) {
        const cleared = state.clearedIds.includes(ch.id);
        const p = ch.getProg(state);
        const ready = !cleared && p.cur >= p.max;
        const row = document.createElement("div");
        row.className = `card-row ${cleared ? "owned" : ready ? "highlight" : ""}`;
        row.innerHTML = `
          <div class="card-info">
            <h3>${cleared ? "✔ " : "🎯 "}${ch.name}</h3>
            <p>조건: ${ch.goalDesc} (${p.cur}/${p.max})</p>
            <p style="color:#fef08a;font-weight:800;">${ch.rewardDesc}</p>
          </div>
        `;
        const btn = document.createElement("button");
        btn.className = `buy-btn ${ready ? "green" : ""}`;
        if (cleared) {
          btn.textContent = "🎬 삽화 보기";
          btn.onclick = () => openCutscene(ch.epKey);
        } else if (ready) {
          btn.textContent = "🎉 보상 받기!";
          btn.onclick = () => triggerChapterClear(ch);
        } else {
          btn.textContent = "⚡ 즉시 클리어";
          btn.onclick = () => triggerChapterClear(ch);
        }
        row.appendChild(btn);
        body.appendChild(row);
      }
    }

    document.getElementById("btn-open-story").onclick = () => {
      const ch = getCurrentChapter();
      if (ch) {
        const p = ch.getProg(state);
        if (p.cur >= p.max) {
          triggerChapterClear(ch);
          return;
        }
      }
      openStoryModal();
    };
    document.getElementById("btn-close-story").onclick = () => {
      state.activeEpKey = null;
      document.getElementById("story-modal").classList.remove("open");
    };

    // =========================================================================
    // 11. 메인 루프
    // =========================================================================
    let last = performance.now();
    let albaTimer = 0;
    let royaltyTimer = 0;
    let uiTimer = 0;

    function loop(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      const tick = now / 1000;

      const m = getMold();
      let speed = (1 / 2.6) * m.speed;
      if (state.buildingFloor >= 2) speed *= 1.4;

      let changed = false;
      for (const sl of state.slots) {
        if (sl.state === "FRONT") {
          sl.progress += speed * dt;
          if (sl.progress >= 0.5) {
            sl.progress = 0.5;
            sl.state = "FLIP_READY";
          }
        } else if (sl.state === "BACK") {
          sl.progress += speed * dt;
          if (sl.progress >= 1.0) {
            sl.progress = 1.0;
            sl.state = "READY";
            sl.burnTimer = 0;
            changed = true;
          }
        } else if (sl.state === "READY") {
          sl.burnTimer += dt;
          if (sl.burnTimer >= 16.0) {
            sl.state = "BURNT";
            changed = true;
          }
        }
      }

      // 손님 인내심 감소
      for (let i = 0; i < 3; i++) {
        const c = state.customers[i];
        if (!c) continue;
        c.patience -= dt * 0.45;
        if (c.patience <= 0) {
          state.combo = 0;
          spawnCustomerAt(i);
          changed = true;
        }
      }

      uiTimer += dt;
      if (changed || uiTimer >= 0.35) {
        uiTimer = 0;
        updateUI();
      }

      if (state.autoAlba) {
        albaTimer += dt;
        if (albaTimer >= 0.55) {
          albaTimer = 0;
          tryAutoServeAny(window.innerWidth * 0.5, window.innerHeight * 0.48);
        }
      }

      if (state.buildingFloor >= 3) {
        royaltyTimer += dt;
        if (royaltyTimer >= 2.0) {
          royaltyTimer = 0;
          state.gold += 20000;
          updateUI();
        }
      }

      for (let i = state.floats.length - 1; i >= 0; i--) {
        state.floats[i].y -= 24 * dt;
        state.floats[i].life -= dt;
        if (state.floats[i].life <= 0) state.floats.splice(i, 1);
      }

      renderCanvas(tick);
      requestAnimationFrame(loop);
    }

    const hadSave = loadGame();
    syncSlots();
    ensureCustomers();
    updateUI();
    setTimeout(resizeCanvas, 30);
    if (!hadSave) {
      openCutscene("ep1_prologue");
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
