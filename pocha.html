<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d18" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-launcher-192.png" />
  <title>🐟 전설의 붕어빵 타이쿤</title>
  <script src="./src/js/launcher_common.js"></script>
  <link rel="stylesheet" href="./src/css/tycoon.css" />
</head>
<body>
  <div class="portrait-viewport">
    <div class="v-stretch-banner" id="banner-top"></div>

    <main class="core-9x16-stage" aria-label="타이쿤 영업 스테이지">
      <!-- Row 1: 상단 HUD & 챕터 진행 요약 -->
      <header class="hud-top">
        <div class="hud-row-main">
          <div class="hud-left">
            <a class="launcher-return-link" href="./" data-launcher-return="true" aria-label="런처 홈으로 복귀">🎮 런처</a>
          </div>
          <div class="hud-stats">
            <span class="gold-pill" id="hud-gold">💰 3,000원</span>
            <span class="combo-pill" id="hud-combo" data-fever="false">⚡ 0콤보</span>
          </div>
          <div class="hud-right">
            <button type="button" class="hud-btn" id="btn-open-story" aria-label="스토리 및 미션">📖</button>
            <button type="button" class="hud-btn" id="btn-open-menu" aria-label="3칸 메뉴 편성">🍽️</button>
            <button type="button" class="hud-btn accent" id="btn-open-shop">🏪 상점</button>
            <button type="button" class="hud-btn" id="btn-mute" aria-label="효과음 전환">🔊</button>
          </div>
        </div>
        <div class="hud-row-sub">
          <span class="hud-region-text" id="hud-region">⚠️무허가 · 역전 3번 출구 포차</span>
          <span class="hud-mission-text" id="hud-mission">🎯 판매 0 / 12마리</span>
          <span class="passive-badges">
            <span class="passive-chip" id="badge-thermo" data-on="false" title="정밀 온도 센서 상태">🌡️</span>
            <span class="passive-chip" id="badge-manager" data-on="false" title="매니저 자동 서빙 상태">👩‍🍳</span>
          </span>
        </div>
      </header>

      <!-- Row 2: 손님 대기열 (고정 3칸) -->
      <section class="customer-zone" id="customer-zone" aria-label="손님 대기열">
        <div class="cust-slot" data-slot="0" data-empty="true">
          <div class="cust-head">
            <span class="cust-name">손님 대기 중</span>
            <span class="cust-tag"></span>
          </div>
          <div class="cust-order">—</div>
          <div class="cust-line">곧 따뜻한 냄새를 맡고 찾아옵니다</div>
          <div class="cust-bar-track"><div class="cust-bar-fill"></div></div>
        </div>
        <div class="cust-slot" data-slot="1" data-empty="true">
          <div class="cust-head">
            <span class="cust-name">손님 대기 중</span>
            <span class="cust-tag"></span>
          </div>
          <div class="cust-order">—</div>
          <div class="cust-line">곧 따뜻한 냄새를 맡고 찾아옵니다</div>
          <div class="cust-bar-track"><div class="cust-bar-fill"></div></div>
        </div>
        <div class="cust-slot" data-slot="2" data-empty="true">
          <div class="cust-head">
            <span class="cust-name">손님 대기 중</span>
            <span class="cust-tag"></span>
          </div>
          <div class="cust-order">—</div>
          <div class="cust-line">곧 따뜻한 냄새를 맡고 찾아옵니다</div>
          <div class="cust-bar-track"><div class="cust-bar-fill"></div></div>
        </div>
      </section>

      <!-- Row 3: 보온 진열대 (활성 로드아웃 3칸) -->
      <section class="rack-zone" id="rack-zone" aria-label="보온 진열대">
        <button type="button" class="rack-tray" data-loadout-idx="0" data-locked="false">
          <span class="rack-tray-info">
            <span class="rack-tray-name">—</span>
            <span class="rack-tray-price">0원</span>
          </span>
          <span class="rack-tray-count">0/12</span>
        </button>
        <button type="button" class="rack-tray" data-loadout-idx="1" data-locked="true">
          <span class="rack-tray-info">
            <span class="rack-tray-name">➕ 빈 트레이</span>
            <span class="rack-tray-price">상점·메뉴</span>
          </span>
          <span class="rack-tray-count">-</span>
        </button>
        <button type="button" class="rack-tray" data-loadout-idx="2" data-locked="true">
          <span class="rack-tray-info">
            <span class="rack-tray-name">➕ 빈 트레이</span>
            <span class="rack-tray-price">상점·메뉴</span>
          </span>
          <span class="rack-tray-count">-</span>
        </button>
      </section>

      <!-- Row 4: 조리기구 불판 캔버스 (연속 브러시 스와이프 지원) -->
      <section class="mold-canvas-container" id="mold-canvas-wrap" aria-label="조리 불판">
        <canvas id="mold-canvas"></canvas>
      </section>

      <!-- Row 5: 3열 능동 조리 액션 바 (수동 실행 버튼 + 물리 분리된 AUTO 칩) -->
      <section class="facility-bar" id="facility-bar" aria-label="조리 편의 설비">
        <div class="fac-card" data-fac-state="locked">
          <button type="button" class="fac-manual-btn">
            <span class="fac-title">🔒 일괄 붓기</span>
            <span class="fac-sub">4,500원 해금</span>
          </button>
          <button type="button" class="fac-auto-btn" data-hidden="true" data-auto="false">AUTO</button>
        </div>
        <div class="fac-card" data-fac-state="locked">
          <button type="button" class="fac-manual-btn">
            <span class="fac-title">🔒 일괄 뒤집기</span>
            <span class="fac-sub">8,500원 해금</span>
          </button>
          <button type="button" class="fac-auto-btn" data-hidden="true" data-auto="false">AUTO</button>
        </div>
        <div class="fac-card" data-fac-state="locked">
          <button type="button" class="fac-manual-btn">
            <span class="fac-title">🔒 일괄 수확</span>
            <span class="fac-sub">26,000원 해금</span>
          </button>
          <button type="button" class="fac-auto-btn" data-hidden="true" data-auto="false">AUTO</button>
        </div>
      </section>

      <!-- Row 6: 3칸 활성 재료 선택 바 -->
      <section class="loadout-bar" id="loadout-bar" aria-label="활성 메뉴 선택">
        <button type="button" class="ing-btn" data-loadout-idx="0" data-selected="true" data-empty-slot="false">
          <span class="ing-name">—</span>
          <span class="ing-cost">투입 -300원</span>
        </button>
        <button type="button" class="ing-btn" data-loadout-idx="1" data-selected="false" data-empty-slot="true">
          <span class="ing-name">🍽️ 메뉴 추가</span>
          <span class="ing-cost">탭하여 해금·편성</span>
        </button>
        <button type="button" class="ing-btn" data-loadout-idx="2" data-selected="false" data-empty-slot="true">
          <span class="ing-name">🍽️ 메뉴 추가</span>
          <span class="ing-cost">탭하여 해금·편성</span>
        </button>
      </section>
    </main>

    <div class="v-stretch-banner" id="banner-bottom"></div>
  </div>

  <div class="toast-banner" id="toast-banner" data-visible="false" role="status" aria-live="polite"></div>

  <!-- 모달 1: 상점 · 메뉴 편성 · 전국 출장 · 5층 타워 -->
  <div class="modal-backdrop" id="shop-modal" data-open="false" role="dialog" aria-modal="true" aria-labelledby="shop-modal-title">
    <div class="modal-sheet">
      <div class="modal-head">
        <h2 id="shop-modal-title">🏪 설비 · 메뉴편성 · 전국출장 · 5층타워</h2>
        <button type="button" class="modal-close" id="btn-close-shop">✕ 닫기</button>
      </div>
      <div class="modal-tabs" id="shop-modal-tabs"></div>
      <div class="modal-body" id="shop-modal-body"></div>
    </div>
  </div>

  <!-- 모달 2: 스토리 챕터 기록 & 삽화 컷신 뷰어 -->
  <div class="modal-backdrop" id="story-modal" data-open="false" role="dialog" aria-modal="true" aria-labelledby="story-modal-title">
    <div class="modal-sheet">
      <div class="modal-head">
        <h2 id="story-modal-title">📖 청년 역전 스토리 &amp; 챕터 기록</h2>
        <button type="button" class="modal-close" id="btn-close-story">✕ 닫기</button>
      </div>
      <div class="modal-body" id="story-modal-body"></div>
    </div>
  </div>

  <script defer src="./src/js/tycoon/audio.js"></script>
  <script defer src="./src/js/tycoon/storage.js"></script>
  <script defer src="./src/js/tycoon/engine.js"></script>
  <script defer src="./src/js/tycoon/themes/bungeo_theme.js"></script>
  <script defer src="./src/js/tycoon/ui.js"></script>
</body>
</html>
