<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>🐟 전설의 붕어빵 타이쿤 : 포차에서 강남 5층 빌딩까지</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #151c2f;
      --card: #1e2942;
      --gold: #fbbf24;
      --green: #22c55e;
      --cyan: #06b6d4;
      --red: #ef4444;
      --text: #f8fafc;
      --sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #060911;
      color: var(--text);
      overflow: hidden;
      touch-action: manipulation;
    }

    .app-shell {
      width: min(100vw, 520px);
      height: 100%;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-left: 1px solid rgba(251, 191, 36, 0.22);
      border-right: 1px solid rgba(251, 191, 36, 0.22);
      position: relative;
      overflow: hidden;
    }

    /* =========================================================
       1. 상단 심플 헤더 (48px 고정, 절대 깨지지 않음)
       ========================================================= */
    .top-bar {
      height: 48px;
      padding: 0 12px;
      background: #111728;
      border-bottom: 2px solid rgba(251, 191, 36, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .money-box {
      font-size: 17px;
      font-weight: 900;
      color: var(--gold);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stage-pill {
      padding: 5px 10px;
      border-radius: 8px;
      background: #1e293b;
      border: 1.5px solid var(--cyan);
      color: #cffafe;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }
    .stage-pill.ready {
      background: #16a34a;
      border-color: #86efac;
      color: #fff;
      animation: pulseScale 0.65s infinite alternate;
    }

    .home-link {
      height: 32px;
      padding: 0 9px;
      border-radius: 8px;
      background: #1e293b;
      border: 1.5px solid #475569;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    @keyframes pulseScale {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    /* 스토리 달성 즉시 알림 배너 */
    .story-alert-banner {
      padding: 8px 12px;
      background: linear-gradient(90deg, #15803d 0%, #0d9488 100%);
      border-bottom: 2px solid #fde047;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .story-alert-banner.show {
      display: flex;
    }
    .story-alert-banner span {
      font-size: 12.5px;
      font-weight: 900;
      color: #fff;
    }
    .story-alert-banner strong {
      padding: 4px 9px;
      border-radius: 6px;
      background: #fef08a;
      color: #0f172a;
      font-size: 11.5px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* =========================================================
       2. 화면 분리형 메인 뷰 컨테이너 (한 화면에 하나만 깔끔하게!)
       ========================================================= */
    .screen-container {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-screen {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .tab-screen.active {
      display: flex;
    }

    /* =========================================================
       [탭 1] 🔥 포차 조리 화면 (오직 주문 1줄 + 양면 주물기계 + 속재료만!)
       ========================================================= */
    .order-strip {
      height: 74px;
      padding: 8px 12px;
      background: linear-gradient(180deg, #131b2e 0%, #1b253d 100%);
      border-bottom: 2px solid #2d3b5e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .cust-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .cust-face {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #0f172a;
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }

    .cust-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }

    .cust-who {
      font-size: 12.5px;
      font-weight: 800;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cust-want {
      font-size: 14px;
      font-weight: 900;
      color: #fef08a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sell-now-btn {
      height: 54px;
      min-width: 116px;
      padding: 0 12px;
      border-radius: 12px;
      border: 2px solid #475569;
      background: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .sell-now-btn.ready {
      background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
      border-color: #86efac;
      color: #fff;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.5);
    }
    .sell-now-btn:active {
      transform: scale(0.96);
    }

    .cook-workspace {
      flex: 1;
      min-height: 0;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #0d1220;
    }

    .batch-action-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .batch-btn {
      height: 36px;
      border-radius: 8px;
      border: 1.5px solid #334155;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .batch-btn.pour { background: #451a03; border-color: #f59e0b; color: #fde68a; }
    .batch-btn.flip { background: #083344; border-color: #06b6d4; color: #a5f3fc; }
    .batch-btn.harvest { background: #052e16; border-color: #22c55e; color: #bbf7d0; }
    .batch-btn:active { transform: scale(0.96); }

    .mold-canvas-wrap {
      flex: 1;
      min-height: 160px;
      width: 100%;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
    }

    #mold-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    .filling-selector-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .fill-chip {
      flex: 1;
      min-width: calc(33.3% - 6px);
      height: 40px;
      padding: 0 10px;
      border-radius: 9px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 12.5px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .fill-chip.active {
      border-color: var(--gold);
      background: #422006;
      color: #fef08a;
    }
    .fill-stock {
      padding: 2px 6px;
      border-radius: 5px;
      background: #0f172a;
      color: #4ade80;
      font-size: 11.5px;
      font-weight: 900;
    }

    /* =========================================================
       [탭 2 / 탭 3 / 탭 4] 전용 전체화면 스크롤 뷰
       ========================================================= */
    .full-pane {
      flex: 1;
      min-height: 0;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pane-header-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pane-header-card h2 {
      font-size: 15px;
      font-weight: 900;
      color: var(--gold);
    }
    .pane-header-card p {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .item-card {
      background: #1a2338;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .item-card.owned {
      border-color: #22c55e;
      background: rgba(20, 83, 45, 0.3);
    }
    .item-card.ready {
      border-color: var(--gold);
      background: #2b2212;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .item-info h3 {
      font-size: 14px;
      font-weight: 900;
      color: #fff;
    }
    .item-info p {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.38;
    }

    .act-btn {
      padding: 9px 12px;
      border-radius: 9px;
      border: 2px solid var(--gold);
      background: #d97706;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .act-btn.green {
      background: #16a34a;
      border-color: #86efac;
    }
    .act-btn:disabled {
      background: #334155;
      border-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* 강남 5층 빌딩 전용 타워 시각화 */
    .building-tower-box {
      background: linear-gradient(180deg, #090d1a 0%, #172554 100%);
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .floor-tier {
      border-radius: 10px;
      border: 2px solid #334155;
      background: rgba(15, 23, 42, 0.85);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .floor-tier.built {
      border-color: var(--gold);
      background: linear-gradient(90deg, rgba(180, 83, 9, 0.45) 0%, rgba(30, 58, 138, 0.75) 100%);
      box-shadow: inset 0 0 12px rgba(251, 191, 36, 0.25);
    }
    .floor-tier.next-up {
      border-color: #4ade80;
      background: rgba(20, 83, 45, 0.45);
    }

    /* =========================================================
       3. 하단 4분할 화면 전환 탭 바 (한 화면 몰아넣기 완전 해결!)
       ========================================================= */
    .bottom-nav {
      height: calc(58px + env(safe-area-inset-bottom, 0px));
      padding: 4px 8px calc(4px + env(safe-area-inset-bottom, 0px));
      background: #111728;
      border-top: 2px solid rgba(251, 191, 36, 0.35);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .nav-tab {
      border-radius: 10px;
      border: 1.5px solid #2e3a59;
      background: #192236;
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      position: relative;
    }
    .nav-tab .ico {
      font-size: 17px;
      line-height: 1;
    }
    .nav-tab.active {
      border-color: var(--gold);
      background: #3b2508;
      color: #fef08a;
    }
    .nav-badge {
      position: absolute;
      top: 3px;
      right: 6px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      display: none;
    }
    .nav-badge.show {
      display: block;
    }

    /* =========================================================
       4. 스토리 컷신 전체화면 모달 (삽화 + 대사)
       ========================================================= */
    .cutscene-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 16, 0.94);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .cutscene-overlay.open {
      display: flex;
    }

    .cutscene-card {
      width: min(480px, 96vw);
      background: #141c30;
      border: 3px solid var(--gold);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px #000;
    }
    .cutscene-head {
      padding: 11px 14px;
      background: #1e293b;
      border-bottom: 2px solid rgba(251, 191, 36, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .cutscene-head h3 {
      font-size: 13.5px;
      font-weight: 900;
      color: var(--gold);
    }
    .skip-btn {
      padding: 5px 10px;
      border-radius: 7px;
      border: none;
      background: #475569;
      color: #fff;
      font-size: 11.5px;
      font-weight: 900;
      cursor: pointer;
    }
    .cutscene-img-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }
    .cutscene-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cutscene-dialog {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }
    .speaker-tag {
      align-self: flex-start;
      padding: 3px 10px;
      border-radius: 6px;
      background: var(--gold);
      color: #0f172a;
      font-size: 12px;
      font-weight: 900;
    }
    .dialog-txt {
      font-size: 14px;
      line-height: 1.55;
      color: #f8fafc;
      min-height: 58px;
    }
    .dialog-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 1. 상단 심플 바 -->
    <header class="top-bar">
      <div class="money-box">💰 <span id="gold-txt">35,000</span>원</div>
      <div class="top-right-group">
        <button type="button" class="stage-pill" id="btn-stage-pill">🎯 제1장 (0/3)</button>
        <a href="./arcade.html" class="home-link">🎮 런처</a>
      </div>
    </header>

    <!-- 스토리 챕터 목표 달성 시 자동 표시되는 배너 -->
    <div class="story-alert-banner" id="story-banner">
      <span id="story-banner-txt">🎉 제1장 달성! 터치하여 스토리 클리어 &amp; 보상 받기!</span>
      <strong>클리어 ▶</strong>
    </div>

    <!-- 2. 화면 분리형 메인 컨테이너 (한 번에 하나의 탭 화면만 깔끔하게 표시!) -->
    <div class="screen-container">

      <!-- [화면 1] 🔥 포차 조리 (기본 화면) -->
      <section class="tab-screen active" id="screen-cook">
        <!-- 1인 집중 주문 카운터 -->
        <div class="order-strip">
          <div class="cust-left">
            <div class="cust-face" id="cust-avatar">👩‍🎓</div>
            <div class="cust-meta">
              <div class="cust-who">
                <span id="cust-name">공시생 이지은</span> · <span id="region-label" style="color:#38bdf8;">역전 포차</span>
              </div>
              <div class="cust-want" id="cust-order-txt">주문: 통단팥 1개 (보유: 2개)</div>
            </div>
          </div>
          <button type="button" class="sell-now-btn" id="btn-sell-now">
            <span id="sell-btn-main">🛍️ 즉시 판매!</span>
            <span id="sell-btn-sub" style="font-size:11px;">+3,500원</span>
          </button>
        </div>

        <!-- 상·하판 1:1 대칭 양면 주물틀 조리 공간 -->
        <div class="cook-workspace">
          <div class="batch-action-bar">
            <button type="button" class="batch-btn pour" id="btn-pour-all">🥣 전체 붓기</button>
            <button type="button" class="batch-btn flip" id="btn-flip-all">🔄 전체 뒤집기</button>
            <button type="button" class="batch-btn harvest" id="btn-harvest-all">🛍️ 전체 수확</button>
          </div>

          <div class="mold-canvas-wrap">
            <canvas id="mold-canvas"></canvas>
          </div>

          <div class="filling-selector-bar" id="filling-bar"></div>
        </div>
      </section>

      <!-- [화면 2] 📖 스토리 & 챕터 클리어 (전용 화면) -->
      <section class="tab-screen" id="screen-story">
        <div class="full-pane" id="story-pane-list"></div>
      </section>

      <!-- [화면 3] 🏪 주물틀 업그레이드 & 전국 푸드트럭 출장 (전용 화면) -->
      <section class="tab-screen" id="screen-shop">
        <div class="full-pane" id="shop-pane-list"></div>
      </section>

      <!-- [화면 4] 🏢 강남 5층 황금 붕어 빌딩 건설 (전용 화면) -->
      <section class="tab-screen" id="screen-building">
        <div class="full-pane" id="building-pane-list"></div>
      </section>

    </div>

    <!-- 3. 하단 4분할 전용 화면 전환 탭 바 -->
    <nav class="bottom-nav">
      <button type="button" class="nav-tab active" data-tab="cook">
        <span class="ico">🔥</span>
        <span>포차 조리</span>
      </button>
      <button type="button" class="nav-tab" data-tab="story">
        <span class="nav-badge" id="badge-story"></span>
        <span class="ico">📖</span>
        <span>스토리·미션</span>
      </button>
      <button type="button" class="nav-tab" data-tab="shop">
        <span class="ico">🏪</span>
        <span>설비·출장</span>
      </button>
      <button type="button" class="nav-tab" data-tab="building">
        <span class="ico">🏢</span>
        <span id="nav-building-txt">강남 빌딩(0층)</span>
      </button>
    </nav>
  </div>

  <!-- 4. 스토리 삽화 컷신 모달 -->
  <div class="cutscene-overlay" id="cutscene-modal">
    <div class="cutscene-card">
      <div class="cutscene-head">
        <h3 id="cs-title">❄️ 프롤로그</h3>
        <button type="button" class="skip-btn" id="btn-cs-skip">건너뛰기 ✕</button>
      </div>
      <div class="cutscene-img-box" id="cs-img-click">
        <img id="cs-img" src="./assets/story_bungeo/bungeo_ep1_prologue_cart.jpg" alt="스토리 삽화" />
      </div>
      <div class="cutscene-dialog" id="cs-dialog-click">
        <span class="speaker-tag" id="cs-speaker">박청춘 (27세)</span>
        <p class="dialog-txt" id="cs-text"></p>
        <div class="dialog-footer">
          <span id="cs-step" style="font-size:12px;color:#94a3b8;">1 / 4</span>
          <button type="button" class="act-btn green" id="btn-cs-next">다음 대사 ▶</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. 스토리 삽화 7종 & 대사 데이터
    // =========================================================================

    let actx = null;
    function tone(freq, dur = 0.07, type = "sine", vol = 0.11) {
      try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === "suspended") actx.resume();
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, actx.currentTime);
        g.gain.setValueAtTime(vol, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
        o.connect(g);
        g.connect(actx.destination);
        o.start();
        o.stop(actx.currentTime + dur);
      } catch (e) {}
    }

      while (state.slots.length < m.slots) {
        state.slots.push({
          state: "IDLE", // IDLE, FRONT, FLIP_READY, BACK, READY
          fillingId: "redbean",
          progress: 0,
          rect: { x: 0, y: 0, w: 0, h: 0 }
        });
      }
      if (state.slots.length > m.slots) state.slots.length = m.slots;
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const r = canvas.getBoundingClientRect();
      if (r.width < 10 || r.height < 10) return;
      canvas.width = Math.floor(r.width * dpr);
      canvas.height = Math.floor(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);

    function drawFishShape(cx, cy, rx, ry, bodyCol, rimCol, mode, fillingId) {
      ctx.save();
      // 꼬리 지느러미
      ctx.beginPath();
      ctx.moveTo(cx + rx * 0.36, cy);
      ctx.lineTo(cx + rx * 0.98, cy - ry * 0.68);
      ctx.lineTo(cx + rx * 0.84, cy);
      ctx.lineTo(cx + rx * 0.98, cy + ry * 0.68);
      ctx.closePath();
      ctx.fillStyle = bodyCol;
      ctx.fill();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = rimCol;
      ctx.stroke();

      // 몸통
      ctx.beginPath();
      ctx.ellipse(cx - rx * 0.14, cy, rx * 0.74, ry * 0.76, 0, 0, Math.PI * 2);
      ctx.fillStyle = bodyCol;
      ctx.fill();
      ctx.lineWidth = mode === "READY" ? 2.6 : 1.8;
      ctx.strokeStyle = rimCol;
      ctx.stroke();

      // 비늘 격자 디테일
      ctx.strokeStyle = mode === "IDLE" ? "rgba(148,163,184,0.22)" : "rgba(120,53,15,0.35)";
      ctx.lineWidth = 1.1;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.arc(cx - rx * 0.1 + i * rx * 0.2, cy, ry * 0.36, -0.7, 0.7);
        ctx.stroke();
      }

      if (mode === "FRONT" || mode === "FLIP_READY") {
        const f = FILLINGS.find(x => x.id === fillingId) || FILLINGS[0];
        ctx.beginPath();
        ctx.ellipse(cx - rx * 0.14, cy, rx * 0.34, ry * 0.4, 0, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        ctx.fill();
      } else if (mode === "BACK" || mode === "READY") {
        ctx.fillStyle = "#27170c";
        ctx.beginPath();
        ctx.arc(cx - rx * 0.48, cy - ry * 0.15, Math.max(2, ry * 0.14), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderCanvas(tick) {
      const r = canvas.getBoundingClientRect();
      const w = r.width;
      const h = r.height;
      if (w < 10 || h < 10) return;
      ctx.clearRect(0, 0, w, h);

      const mold = getMold();
      const cols = mold.cols;
      const rows = mold.rows;
      const isGold = state.currentMoldIdx >= 3;

      // 1) 상단 열린 주물 뚜껑 (상판: 하판과 가로·세로 칸수가 1:1로 완벽히 맞물리는 양면 개폐식 주물틀!)
      const lidH = Math.max(54, Math.min(88, h * 0.23));
      const hingeH = 14;
      const plateY = lidH + hingeH;
      const plateH = h - plateY - 4;

      // 상판 뚜껑 외곽 (사다리꼴 원근감 + 리벳)
      ctx.fillStyle = isGold ? "#423215" : "#1f2737";
      ctx.strokeStyle = isGold ? "#fbbf24" : "#64748b";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(10, 2, w - 20, lidH - 2, 10);
      ctx.fill();
      ctx.stroke();

      // 상판 뚜껑 내부 1:1 대칭 붕어 음각 홈 (하판과 똑같은 cols × rows!)
      const lidPadX = 16;
      const lidPadY = 6;
      const lidCellW = (w - 20 - lidPadX * 2 - (cols - 1) * 8) / cols;
      const lidCellH = (lidH - lidPadY * 2 - (rows - 1) * 4) / rows;
      for (let i = 0; i < mold.slots; i++) {
        const c = i % cols;
        const row = Math.floor(i / cols);
        const lx = 10 + lidPadX + c * (lidCellW + 8);
        const ly = 2 + lidPadY + row * (lidCellH + 4);
        ctx.fillStyle = "#111622";
        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(lx, ly, lidCellW, lidCellH, 6);
        ctx.fill();
        ctx.stroke();
        drawFishShape(
          lx + lidCellW * 0.5,
          ly + lidCellH * 0.5,
          Math.min(lidCellW * 0.34, 34),
          Math.min(lidCellH * 0.36, 12),
          "#192132",
          "#475569",
          "IDLE",
          null
        );
      }

      // 2) 중앙 황동 회전 경첩 바 (위 뚜껑과 아래 판을 연결하는 회전축!)
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(6, lidH, w - 12, hingeH);
      for (let c = 0; c < cols; c++) {
        const hx = 26 + c * ((w - 52) / cols) + ((w - 52) / cols) * 0.5 - 18;
        ctx.fillStyle = "#d97706";
        ctx.strokeStyle = "#fde047";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(hx, lidH + 2, 36, hingeH - 4, 4);
        ctx.fill();
        ctx.stroke();
      }

      // 3) 하판 메인 구이 주물틀 본체
      ctx.fillStyle = isGold ? "#3b2c12" : "#182030";
      ctx.strokeStyle = isGold ? "#fbbf24" : "#64748b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(4, plateY, w - 8, plateH, 12);
      ctx.fill();
      ctx.stroke();

      const pad = 8;
      const cellW = (w - 24 - pad * (cols - 1)) / cols;
      const cellH = (plateH - 18 - pad * (rows - 1)) / rows;

      for (let i = 0; i < mold.slots; i++) {
        const sl = state.slots[i];
        const c = i % cols;
        const row = Math.floor(i / cols);
        const sx = 12 + c * (cellW + pad);
        const sy = plateY + 9 + row * (cellH + pad);
        sl.rect = { x: sx, y: sy, w: cellW, h: cellH };

        let bg = "#0f1420";
        let border = "#334155";
        let bw = 2;

        if (sl.state === "FLIP_READY") {
          bg = "#083344";
          border = Math.sin(tick * 10) > 0 ? "#22d3ee" : "#fbbf24";
          bw = 3;
        } else if (sl.state === "READY") {
          bg = "#14532d";
          border = "#4ade80";
          bw = 3;
        }

        ctx.fillStyle = bg;
        ctx.strokeStyle = border;
        ctx.lineWidth = bw;
        ctx.beginPath();
        ctx.roundRect(sx, sy, cellW, cellH, 10);
        ctx.fill();
        ctx.stroke();

        // 양옆 회전 손잡이 핀 표현
        ctx.fillStyle = "#64748b";
        ctx.fillRect(sx + 2, sy + cellH * 0.42 - 3, 4, 6);
        ctx.fillRect(sx + cellW - 6, sy + cellH * 0.42 - 3, 4, 6);

        const cx = sx + cellW * 0.5;
        const cy = sy + cellH * 0.42;
        const rx = Math.min(cellW * 0.36, 48);
        const ry = Math.min(cellH * 0.27, 26);

        let label = "";
        let labelCol = "#94a3b8";

        if (sl.state === "IDLE") {
          drawFishShape(cx, cy, rx, ry, "#1e293b", "#475569", "IDLE", null);
          label = "🥣 터치: 붓기";
          labelCol = "#cbd5e1";
        } else if (sl.state === "FRONT") {
          drawFishShape(cx, cy, rx, ry, "#fef3c7", "#d97706", "FRONT", sl.fillingId);
          label = `앞면 ${Math.min(99, Math.floor((sl.progress / 0.5) * 100))}%`;
          labelCol = "#fde047";
        } else if (sl.state === "FLIP_READY") {
          drawFishShape(cx, cy, rx, ry, "#fde68a", "#ea580c", "FLIP_READY", sl.fillingId);
          label = "🔄 뒤집기!";
          labelCol = "#67e8f9";
        } else if (sl.state === "BACK") {
          drawFishShape(cx, cy, rx, ry, "#ea580c", "#7c2d12", "BACK", sl.fillingId);
          label = `뒷면 ${Math.min(99, Math.floor(((sl.progress - 0.5) / 0.5) * 100))}%`;
          labelCol = "#fdba74";
        } else if (sl.state === "READY") {
          drawFishShape(cx, cy, rx, ry, "#facc15", "#b45309", "READY", sl.fillingId);
          label = "✨ 완성! 수확";
          labelCol = "#86efac";
        }

        ctx.fillStyle = labelCol;
        ctx.font = "900 11.5px Pretendard, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(label, cx, sy + cellH - 7);
      }

      for (let i = state.floats.length - 1; i >= 0; i--) {
        const ft = state.floats[i];
        ctx.fillStyle = ft.color;
        ctx.font = "900 13.5px Pretendard, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(ft.text, ft.x, ft.y);
      }
    }

    function addFloat(text, x, y, color = "#fef08a") {
      state.floats.push({ text, x, y, color, life: 0.8 });
    }

    // =========================================================================
    // 7. 조리 조작 (개별 슬롯 터치 + 전체 일괄 버튼)
    // =========================================================================
    function pourSlot(sl) {
      if (sl.state !== "IDLE") return false;
      sl.state = "FRONT";
      sl.fillingId = state.selectedFillingId;
      sl.progress = 0;
      return true;
    }

    function flipSlot(sl) {
      if (sl.state !== "FLIP_READY") return false;
      sl.state = "BACK";
      return true;
    }

    function harvestSlot(sl) {
      if (sl.state !== "READY") return false;
      const m = getMold();
      const bonus = m.yieldBonus || 1;
      state.stock[sl.fillingId] = (state.stock[sl.fillingId] || 0) + bonus;
      state.totalBaked += bonus;
      sl.state = "IDLE";
      sl.progress = 0;
      return true;
    }

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      for (const sl of state.slots) {
        const r = sl.rect;
        if (x < r.x || x > r.x + r.w || y < r.y || y > r.y + r.h) continue;

        if (sl.state === "IDLE") {
          pourSlot(sl);
          sfxPour();
          addFloat("🥣 반죽 붓기!", r.x + r.w / 2, r.y + 18, "#bae6fd");
        } else if (sl.state === "FLIP_READY") {
          flipSlot(sl);
          sfxFlip();
          addFloat("🔄 철컥! 뒤집기!", r.x + r.w / 2, r.y + 18, "#67e8f9");
        } else if (sl.state === "READY") {
          harvestSlot(sl);
          sfxHarvest();
          addFloat("🛍️ 수확 완료!", r.x + r.w / 2, r.y + 18, "#4ade80");
          updateUI();
          saveGame();
        }
        return;
      }
    });

    document.getElementById("btn-pour-all").onclick = () => {
      let cnt = 0;
      for (const sl of state.slots) if (pourSlot(sl)) cnt++;
      if (cnt > 0) sfxPour();
    };

    document.getElementById("btn-flip-all").onclick = () => {
      let cnt = 0;
      for (const sl of state.slots) if (flipSlot(sl)) cnt++;
      if (cnt > 0) sfxFlip();
    };

    document.getElementById("btn-harvest-all").onclick = () => {
      let cnt = 0;
      for (const sl of state.slots) if (harvestSlot(sl)) cnt++;
      if (cnt > 0) {
        sfxHarvest();
        updateUI();
        saveGame();
      }
    };

    // =========================================================================
    // 8. 손님 주문 & 즉시 판매
    // =========================================================================
    const CUST_POOL = [
      { name: "공시생 이지은", avatar: "👩‍🎓" },
      { name: "퇴근길 김대리", avatar: "👨‍💼" },
      { name: "대기업 최상무", avatar: "🕴️" },
      { name: "유튜버 먹짱", avatar: "📸" },
      { name: "단골 여대생", avatar: "🧣" }
    ];

    function nextCustomer() {
      const pickCust = CUST_POOL[Math.floor(Math.random() * CUST_POOL.length)];
      const avail = FILLINGS.filter(f => state.unlockedFillings.includes(f.id));
      const pickFill = avail[Math.floor(Math.random() * avail.length)] || FILLINGS[0];
      const qty = 1 + Math.floor(Math.random() * 2);
      state.customer = {
        name: pickCust.name,
        avatar: pickCust.avatar,
        fillingId: pickFill.id,
        qty
      };
    }

    function getUnitPrice(fid) {
      const f = FILLINGS.find(x => x.id === fid) || FILLINGS[0];
      const m = getMold();
      const reg = getRegion();
      let mult = m.priceMult * reg.mult;
      if (state.licensed) mult *= 1.3;
      if (state.buildingFloor >= 1) mult *= 1.3;
      if (state.buildingFloor >= 4) mult *= 1.5;
      return Math.round(f.price * mult);
    }

    function canServe() {
      if (!state.customer) return false;
      return (state.stock[state.customer.fillingId] || 0) >= state.customer.qty;
    }

    function serveCustomer() {
      if (!canServe()) return;
      const c = state.customer;
      state.stock[c.fillingId] -= c.qty;
      const pay = getUnitPrice(c.fillingId) * c.qty;
      state.gold += pay;
      sfxCash();
      nextCustomer();
      updateUI();
      saveGame();
    }

    document.getElementById("btn-sell-now").onclick = () => serveCustomer();

    // =========================================================================
    // 9. 화면 탭 전환 & 전용 뷰 렌더링
    // =========================================================================
    function switchTab(tabKey) {
      state.activeTab = tabKey;
      document.querySelectorAll(".nav-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tabKey);
      });
      document.getElementById("screen-cook").classList.toggle("active", tabKey === "cook");
      document.getElementById("screen-story").classList.toggle("active", tabKey === "story");
      document.getElementById("screen-shop").classList.toggle("active", tabKey === "shop");
      document.getElementById("screen-building").classList.toggle("active", tabKey === "building");

      if (tabKey === "cook") setTimeout(resizeCanvas, 20);
      updateUI();
    }

    document.querySelectorAll(".nav-tab").forEach(btn => {
      btn.onclick = () => {
        sfxPour();
        switchTab(btn.dataset.tab);
      };
    });

    function getCurrentChapter() {
      for (const ch of CHAPTERS) {
        if (!state.clearedIds.includes(ch.id)) return ch;
      }
      return null;
    }

    function triggerChapterClear(ch) {
      if (!ch || state.clearedIds.includes(ch.id)) return;
      state.clearedIds.push(ch.id);
      sfxCash();
      ch.onClear(state);
      saveGame();
      updateUI();
      openCutscene(ch.epKey);
    }

    function renderStoryPane() {
      const box = document.getElementById("story-pane-list");
      box.innerHTML = `
        <div class="pane-header-card">
          <h2>📖 청년 성공 스토리 &amp; 챕터 미션</h2>
          <p>조건을 달성하거나 <strong>[⚡ 즉시 클리어]</strong> 버튼을 눌러 막힘없이 스토리를 감상하고 보상을 받으세요!</p>
        </div>
      `;

      for (const ch of CHAPTERS) {
        const cleared = state.clearedIds.includes(ch.id);
        const ready = !cleared && ch.isReady(state);
        const card = document.createElement("div");
        card.className = `item-card ${cleared ? "owned" : ready ? "ready" : ""}`;
        card.innerHTML = `
          <div class="item-info">
            <h3>${cleared ? "✔ " : "🎯 "}${ch.name}</h3>
            <p>목표: ${ch.goalDesc} (${ch.progText(state)})</p>
            <p style="color:#fef08a;font-weight:800;">${ch.rewardDesc}</p>
          </div>
        `;

        btn.className = `act-btn ${ready ? "green" : ""}`;
        if (cleared) {
          btn.textContent = "🎬 삽화 다시보기";
          btn.onclick = () => openCutscene(ch.epKey);
        } else if (ready) {
          btn.textContent = "🎉 보상 받고 클리어!";
          btn.onclick = () => triggerChapterClear(ch);
        } else {
          btn.textContent = "⚡ 즉시 클리어";
          btn.onclick = () => triggerChapterClear(ch);

        card.appendChild(btn);
        box.appendChild(card);
      }

      const prolCard = document.createElement("div");
      prolCard.className = "item-card owned";
      prolCard.innerHTML = `
        <div class="item-info">
          <h3>❄️ 프롤로그: 100번째 불합격 문자와 할머니의 3구 무쇠틀</h3>
          <p>취업난 겨울밤, 할머니의 붕어빵 틀로 다시 일어서는 첫 이야기</p>
        </div>
      `;
      const pBtn = document.createElement("button");
      pBtn.className = "act-btn";
      pBtn.textContent = "🎬 삽화 보기";
      pBtn.onclick = () => openCutscene("ep1_prologue");
      prolCard.appendChild(pBtn);
      box.appendChild(prolCard);
    }

    function renderShopPane() {
      const box = document.getElementById("shop-pane-list");
      box.innerHTML = `
        <div class="pane-header-card">
          <h2>🏪 양면 주물 기계 업그레이드 &amp; 전국 푸드트럭 출장</h2>
          <p>상·하판 대칭 주물틀을 업그레이드하고 전국 핫플레이스로 출장을 떠나세요!</p>
        </div>
      `;

      // 김민지 매니저
      const alba = document.createElement("div");
      alba.className = `item-card ${state.autoAlba ? "owned" : "ready"}`;
      alba.innerHTML = `
        <div class="item-info">
          <h3>👩‍🍳 김민지 자동 판매 매니저 고용</h3>
          <p>보온함에 구워진 붕어빵이 있으면 손님에게 100% 자동으로 판매합니다!</p>
        </div>
      `;
      const aBtn = document.createElement("button");
      aBtn.className = "act-btn";
      aBtn.textContent = state.autoAlba ? "✔ 고용 완료" : "30,000원 고용";
      aBtn.disabled = state.autoAlba || state.gold < 30000;
      aBtn.onclick = () => {
        state.gold -= 30000;
        state.autoAlba = true;
        sfxCash();
        saveGame();
        updateUI();
      };
      alba.appendChild(aBtn);
      box.appendChild(alba);

      // 주물틀 목록
      for (let i = 0; i < MOLDS.length; i++) {

            saveGame();
            updateUI();
          };

          btn.textContent = `${m.cost.toLocaleString()}원 구매`;

            state.ownedMolds.push(m.id);
            state.currentMoldIdx = i;

            saveGame();

        box.appendChild(card);
      }

      // 전국 푸드트럭 출장지
      for (const reg of REGIONS) {

            state.unlockedFillings.push(reg.fillId);

            sfxCash();
            saveGame();
            updateUI();
          };
        }
        card.appendChild(btn);
        box.appendChild(card);
      }
    }

    function renderBuildingPane() {
      const box = document.getElementById("building-pane-list");
      const invested = BUILDINGS.filter(b => state.buildingFloor >= b.floor).reduce((a, b) => a + b.cost, 0);
      box.innerHTML = `
        <div class="pane-header-card">
          <h2>🏢 강남 5층 『청춘 황금 붕어 타워』 건설 현황 (${state.buildingFloor}/5층)</h2>
          <p>누적 빌딩 자산 가치: <strong style="color:#fbbf24;">${invested.toLocaleString()}원</strong> / 최종 목표 1,130,000원</p>
        </div>
      `;

      const tower = document.createElement("div");
      tower.className = "building-tower-box";

      // 5층부터 1층까지 실제 건물 층 구조대로 위에서 아래로 표시!
      for (let idx = BUILDINGS.length - 1; idx >= 0; idx--) {
        const b = BUILDINGS[idx];
        const built = state.buildingFloor >= b.floor;
        const isNext = state.buildingFloor === b.floor - 1;

        const tier = document.createElement("div");
        tier.className = `floor-tier ${built ? "built" : isNext ? "next-up" : ""}`;
        tier.innerHTML = `
          <div class="item-info">
            <h3>${built ? "🌕 " : "🏗️ "}${b.name}</h3>
            <p>${b.desc}</p>
            <p style="color:#fbbf24;font-weight:900;">🏢 분양·증축 금액: ${b.cost.toLocaleString()}원</p>
          </div>
        `;
        const btn = document.createElement("button");
        btn.className = `act-btn ${isNext ? "green" : ""}`;
        if (built) {
          btn.textContent = `✔ ${b.floor}층 완공`;
          btn.disabled = true;
        } else if (!isNext) {
          btn.textContent = `${b.floor - 1}층 먼저`;
          btn.disabled = true;
        } else {
          btn.textContent = `${b.cost.toLocaleString()}원 증축`;
          btn.disabled = state.gold < b.cost;
          btn.onclick = () => {
            state.gold -= b.cost;
            state.buildingFloor = b.floor;
            sfxCash();
            saveGame();
            updateUI();
            if (b.floor === 5) triggerChapterClear(CHAPTERS[4]);
          };
        }
        tier.appendChild(btn);
        tower.appendChild(tier);
      }

      box.appendChild(tower);
    }

    function updateUI() {
      document.getElementById("gold-txt").textContent = state.gold.toLocaleString();
      document.getElementById("nav-building-txt").textContent = `강남 빌딩(${state.buildingFloor}층)`;

      const ch = getCurrentChapter();
      const stagePill = document.getElementById("btn-stage-pill");
      const banner = document.getElementById("story-banner");
      const badge = document.getElementById("badge-story");

      if (!ch) {
        stagePill.textContent = "👑 최종 엔딩 달성!";
        stagePill.classList.remove("ready");
        banner.classList.remove("show");
        badge.classList.remove("show");
      } else {
        const ready = ch.isReady(state);
        stagePill.textContent = ready ? `🎉 제${ch.id}장 클리어!` : `🎯 제${ch.id}장 (${ch.progText(state)})`;
        stagePill.classList.toggle("ready", ready);
        banner.classList.toggle("show", ready);
        badge.classList.toggle("show", ready);
        if (ready) {
          document.getElementById("story-banner-txt").textContent = `🎉 [${ch.name}] 달성! 터치하여 스토리 클리어 & 보상 받기!`;
        }
      }

      // 손님 카운터 갱신
      if (!state.customer) nextCustomer();
      const c = state.customer;
      const f = FILLINGS.find(x => x.id === c.fillingId) || FILLINGS[0];
      const have = state.stock[c.fillingId] || 0;
      const totalPay = getUnitPrice(c.fillingId) * c.qty;
      const reg = getRegion();

      document.getElementById("cust-avatar").textContent = c.avatar;
      document.getElementById("cust-name").textContent = c.name;
      document.getElementById("region-label").textContent = reg.name;
      document.getElementById("cust-order-txt").textContent = `주문: ${f.shortName} ${c.qty}개 (보온함: ${have}개)`;

      const sellBtn = document.getElementById("btn-sell-now");
      const ok = canServe();
      sellBtn.className = `sell-now-btn ${ok ? "ready" : ""}`;
      document.getElementById("sell-btn-main").textContent = ok ? "🛍️ 즉시 판매!" : "🛍️ 빵 굽는 중";
      document.getElementById("sell-btn-sub").textContent = ok ? `+${totalPay.toLocaleString()}원` : `${f.shortName} 구워주세요`;

      // 속재료 버튼 바 갱신 (해금된 메뉴만 노출)
      const fBar = document.getElementById("filling-bar");
      fBar.innerHTML = "";
      for (const item of FILLINGS) {
        if (!state.unlockedFillings.includes(item.id)) continue;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `fill-chip ${state.selectedFillingId === item.id ? "active" : ""}`;
        const cnt = state.stock[item.id] || 0;
        btn.innerHTML = `
          <span>${item.name}</span>
          <span class="fill-stock">${cnt}개</span>
        `;
        btn.onclick = () => {
          state.selectedFillingId = item.id;
          sfxPour();
          updateUI();
        };
        fBar.appendChild(btn);
      }

      if (state.activeTab === "story") renderStoryPane();
      if (state.activeTab === "shop") renderShopPane();
      if (state.activeTab === "building") renderBuildingPane();
    }

    document.getElementById("btn-stage-pill").onclick = () => {
      const ch = getCurrentChapter();
      if (ch && ch.isReady(state)) {
        triggerChapterClear(ch);
      } else {
        switchTab("story");
      }
    };

    document.getElementById("story-banner").onclick = () => {
      const ch = getCurrentChapter();
      if (ch) triggerChapterClear(ch);
    };

    // =========================================================================
    // 10. 스토리 컷신 모달 제어
    // =========================================================================
    function openCutscene(epKey) {
      if (!EPISODES[epKey]) return;
      state.activeEpKey = epKey;
      state.activeLineIdx = 0;
      syncCutsceneModal();
      document.getElementById("cutscene-modal").classList.add("open");
    }

    function syncCutsceneModal() {
      const ep = EPISODES[state.activeEpKey];
      if (!ep) return;
      const line = ep.lines[state.activeLineIdx] || ep.lines[0];
      document.getElementById("cs-title").textContent = ep.title;
      document.getElementById("cs-img").src = ep.img;
      document.getElementById("cs-speaker").textContent = line.speaker;
      document.getElementById("cs-text").textContent = line.text;
      document.getElementById("cs-step").textContent = `${state.activeLineIdx + 1} / ${ep.lines.length} (화면을 터치하면 넘어갑니다)`;
      document.getElementById("btn-cs-next").textContent =
        state.activeLineIdx + 1 >= ep.lines.length ? "영업 계속하기 ▶" : "다음 대사 ▶";
    }

    function advanceCutscene() {
      const ep = EPISODES[state.activeEpKey];
      if (!ep) return;
      if (state.activeLineIdx + 1 < ep.lines.length) {
        state.activeLineIdx++;
        sfxPour();
        syncCutsceneModal();
      } else {
        state.activeEpKey = null;
        document.getElementById("cutscene-modal").classList.remove("open");
      }
    }

    document.getElementById("cs-img-click").onclick = advanceCutscene;
    document.getElementById("cs-dialog-click").onclick = advanceCutscene;
    document.getElementById("btn-cs-skip").onclick = (e) => {
      e.stopPropagation();
      state.activeEpKey = null;
      document.getElementById("cutscene-modal").classList.remove("open");
    };

    // =========================================================================
    // 11. 메인 루프
    // =========================================================================
    let last = performance.now();
    let albaTimer = 0;
    let royaltyTimer = 0;

    function loop(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      const tick = now / 1000;

      const m = getMold();
      let speed = (1 / 2.6) * m.speed;
      if (state.buildingFloor >= 2) speed *= 1.4;

      let changed = false;
      for (const sl of state.slots) {
        if (sl.state === "FRONT") {
          sl.progress += speed * dt;
          if (sl.progress >= 0.5) {
            sl.progress = 0.5;
            sl.state = "FLIP_READY";
          }
        } else if (sl.state === "BACK") {
          sl.progress += speed * dt;
          if (sl.progress >= 1.0) {
            sl.progress = 1.0;
            sl.state = "READY";
            changed = true;
          }
        }
      }
      if (changed) updateUI();

      if (state.autoAlba && canServe()) {
        albaTimer += dt;
        if (albaTimer >= 0.5) {
          albaTimer = 0;
          serveCustomer();
        }
      }

      if (state.buildingFloor >= 3) {
        royaltyTimer += dt;
        if (royaltyTimer >= 2.0) {
          royaltyTimer = 0;
          state.gold += 20000;
          updateUI();
        }
      }

      for (let i = state.floats.length - 1; i >= 0; i--) {
        state.floats[i].y -= 24 * dt;
        state.floats[i].life -= dt;
        if (state.floats[i].life <= 0) state.floats.splice(i, 1);
      }

      if (state.activeTab === "cook") {
        renderCanvas(tick);
      }
      requestAnimationFrame(loop);
    }

    const hadSave = loadGame();
    syncSlots();
    nextCustomer();
    updateUI();
    setTimeout(resizeCanvas, 30);
    if (!hadSave) {
      openCutscene("ep1_prologue");
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
